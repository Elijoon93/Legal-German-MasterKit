name: Legal German MasterKit QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: legal-german-masterkit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run cumulative v9.3.2 startup and blank-page prevention gates
        run: node scripts/qa-v932.mjs

  visual-acceptance:
    if: github.event_name != 'schedule'
    needs: source-gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Test
        run: npm install --no-audit --no-fund
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Run 13-profile startup and visual acceptance
        run: npm run qa:visual
      - name: Upload startup and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-recovery-v9.3.2
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  public-runtime-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: source-gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LGMK_BASE_URL: https://elijoon93.github.io/Legal-German-MasterKit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Test
        run: npm install --no-audit --no-fund
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Run public GitHub Pages startup acceptance
        run: npm run qa:visual
      - name: Upload public runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-startup-v9.3.2
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
