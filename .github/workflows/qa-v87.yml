name: Legal German MasterKit QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run v8.7 quality gates
        run: node scripts/qa-v87.mjs
      - name: Run v8.8 quality gates
        run: node scripts/qa-v88.mjs
      - name: Run v8.9 architecture quality gates
        run: node scripts/qa-v89.mjs
