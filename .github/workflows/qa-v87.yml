name: Legal German MasterKit Final QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: legal-german-masterkit-final-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run final 9.4.0 source and consolidation gates
        run: node scripts/qa-v940.mjs

  visual-acceptance:
    needs: source-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Test
        run: npm install --no-audit --no-fund
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Run 13-profile local runtime and visual acceptance
        run: npm run qa:visual
      - name: Upload local final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-acceptance-9.4.0-local
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

  public-runtime-smoke:
    needs: visual-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      LGMK_BASE_URL: https://elijoon93.github.io/Legal-German-MasterKit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Wait for GitHub Pages 9.4.0
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            page="$(curl -LfsS "${LGMK_BASE_URL}/?v=940&deploy=${GITHUB_SHA}&attempt=${attempt}" || true)"
            if printf '%s' "$page" | grep -q 'Legal German MasterKit v9.4.0'; then
              echo "GitHub Pages is serving 9.4.0"
              exit 0
            fi
            echo "Waiting for Pages deployment (${attempt}/60)"
            sleep 10
          done
          echo "GitHub Pages did not publish 9.4.0 within 10 minutes"
          exit 1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Test
        run: npm install --no-audit --no-fund
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Run public GitHub Pages acceptance
        run: npm run qa:visual
      - name: Upload public final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-acceptance-9.4.0-public
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
