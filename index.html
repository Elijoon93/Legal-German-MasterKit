<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d3b4a">
<meta name="description" content="Legal German MasterKit v6.0 — pronunciation, listening, speaking, reading and writing">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Legal German MasterKit v6.0</title>
<style>
:root{--bg:#eef4f6;--card:#fff;--ink:#17324d;--muted:#647789;--line:#d5e1e7;--brand:#0b7285;--navy:#0d3b4a;--soft:#e7f3f5;--ok:#2b8a3e;--warn:#b26a00;--bad:#c92a2a;--shadow:0 12px 30px rgba(13,59,74,.09)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif;line-height:1.75;padding-bottom:82px}
button,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:40;background:linear-gradient(135deg,var(--navy),var(--brand));color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}.top h1{margin:0;font-size:1rem}.top small{display:block;color:#d9edf0;font-size:.72rem}
.top button{min-height:44px;border:1px solid #ffffff77;background:#ffffff12;color:#fff;border-radius:12px;padding:0 12px}
.wrap{max-width:1100px;margin:auto;padding:14px}.view{display:none}.view.active{display:block}.hero,.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.hero{padding:22px;background:linear-gradient(135deg,#12344d,#0b7285);color:#fff}.hero h2{margin:0 0 8px}.hero p{color:#d9edf0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.grid.two{grid-template-columns:repeat(2,1fr)}
.card,.panel{padding:16px}.card h3,.panel h3{margin:0 0 8px}.muted{color:var(--muted)}.metric{font-size:1.8rem;font-weight:800;color:var(--brand)}
.btn{min-height:44px;border:0;border-radius:12px;background:var(--brand);color:#fff;padding:0 14px;cursor:pointer}.btn.secondary{background:var(--soft);color:var(--ink)}.btn.good{background:var(--ok)}.btn.warn{background:var(--warn)}.btn.bad{background:var(--bad)}
.input,.select,textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;color:var(--ink)}textarea{min-height:180px;direction:ltr;text-align:left}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.toolbar>*{flex:1;min-width:140px}.pill{display:inline-block;background:var(--soft);border-radius:999px;padding:4px 9px;font-size:.78rem;margin:2px}
.term{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}.term:last-child{border-bottom:0}.de{direction:ltr;text-align:left}.audio-row{display:flex;gap:8px;flex-wrap:wrap}.feedback,.example{background:var(--soft);border-radius:12px;padding:11px;margin:8px 0}.feedback.ok{border-right:4px solid var(--ok)}.feedback.warn{border-right:4px solid var(--warn)}.feedback.bad{border-right:4px solid var(--bad)}
.reading{direction:ltr;text-align:left;font-family:Arial,sans-serif;font-size:1.02rem}.sentence{padding:3px 5px;border-radius:6px;cursor:pointer}.sentence:hover{background:#dff2f5}.transcript{direction:ltr;text-align:left;white-space:pre-wrap;background:#f8fbfc;border:1px solid var(--line);border-radius:12px;padding:12px}
.rec-box{border:2px dashed var(--line);border-radius:16px;padding:18px;text-align:center}.rec-dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#adb5bd;margin-inline-end:6px}.rec-dot.on{background:var(--bad);box-shadow:0 0 0 6px #c92a2a22}
.bar{height:10px;background:#dfe9ee;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:var(--brand)}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:50;display:grid;grid-template-columns:repeat(5,1fr);background:#fffffffa;border-top:1px solid var(--line);padding:5px 4px calc(5px + env(safe-area-inset-bottom))}
.nav{border:0;background:transparent;min-height:58px;font-size:.68rem;color:var(--muted)}.nav b{display:block;font-size:1.05rem}.nav.active{color:var(--brand);font-weight:700}
@media(max-width:800px){.grid,.grid.two{grid-template-columns:1fr}.toolbar>*{width:100%}}
@media(min-width:801px){body{padding-bottom:0}.bottom{position:sticky;top:68px;bottom:auto;max-width:1100px;margin:auto;border:1px solid var(--line);border-radius:14px;grid-template-columns:repeat(7,1fr)}}
</style>
</head>
<body>
<header class="top"><div><h1>Legal German MasterKit v6.0</h1><small>Four Skills + Pronunciation · LL.M. oec. Jena</small></div><button id="install" hidden>نصب</button></header>
<nav class="bottom" id="nav"></nav>
<main class="wrap">
<section id="home" class="view active"></section>
<section id="pronunciation" class="view"></section>
<section id="listening" class="view"></section>
<section id="speaking" class="view"></section>
<section id="reading" class="view"></section>
<section id="writing" class="view"></section>
<section id="progress" class="view"></section>
</main>
<script>
const KEY='lgmk-v6-state';
let S=JSON.parse(localStorage.getItem(KEY)||'{}');
S={view:'home',done:{},scores:{},speechText:'',writing:'',...S};
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const V=['home','pronunciation','listening','speaking','reading','writing','progress'];
const N={home:['⌂','خانه'],pronunciation:['🔊','تلفظ'],listening:['🎧','شنیدار'],speaking:['🎙','گفتار'],reading:['📖','خواندن'],writing:['✎','نوشتن'],progress:['◔','پیشرفت']};

const TERMS=[
['der Anspruch','حق مطالبه','K hat einen Anspruch auf Lieferung.'],
['die Willenserklärung','اظهار اراده','Angebot und Annahme sind Willenserklärungen.'],
['der Kaufvertrag','قرارداد خرید','Der Kaufvertrag kommt durch Angebot und Annahme zustande.'],
['die Übergabe','تحویل','Der Verkäufer schuldet die Übergabe der Sache.'],
['die Übereignung','انتقال مالکیت','Die Übereignung erfolgt nach den sachenrechtlichen Vorschriften.'],
['die Fälligkeit','سررسید','Der Anspruch ist fällig.'],
['die Einwendung','دفاع ماهوی','Dem Anspruch steht keine Einwendung entgegen.'],
['die Einrede','دفاع شکلی','Der Schuldner kann eine Einrede erheben.'],
['der Sachmangel','عیب مادی','Die Sache ist mangelhaft.'],
['die Nacherfüllung','اجرای مجدد تعهد','Der Käufer kann Nacherfüllung verlangen.'],
['der Rücktritt','فسخ','Der Käufer erklärt den Rücktritt.'],
['die Minderung','کاهش ثمن','Der Käufer kann den Kaufpreis mindern.'],
['der Schadensersatz','خسارت','Ein Anspruch auf Schadensersatz kommt in Betracht.'],
['die Anfechtung','ابطال اراده','Die Willenserklärung kann angefochten werden.'],
['die Subsumtion','تطبیق','Die Subsumtion verbindet Norm und Sachverhalt.'],
['die Verhältnismäßigkeit','تناسب','Die Maßnahme muss verhältnismäßig sein.'],
['die Anhörung','استماع اظهارات','Vor Erlass ist eine Anhörung erforderlich.'],
['die Begründung','استدلال/توجیه','Der Verwaltungsakt muss begründet werden.'],
['die Rechtsprechung','رویه قضایی','Die Rechtsprechung des BGH ist zu berücksichtigen.'],
['die herrschende Meinung','نظر غالب','Nach herrschender Meinung ist die Norm anwendbar.']
];

const LISTEN=[
{t:'Kaufvertrag',text:'Ein Kaufvertrag kommt durch zwei übereinstimmende Willenserklärungen zustande: Angebot und Annahme. Der Verkäufer ist verpflichtet, die Sache zu übergeben und dem Käufer Eigentum daran zu verschaffen. Der Käufer muss den vereinbarten Kaufpreis zahlen und die Sache abnehmen.',q:'Welche zwei Willenserklärungen sind erforderlich?',a:'Angebot und Annahme'},
{t:'Sachmangel',text:'Ist die Kaufsache mangelhaft, kann der Käufer zunächst Nacherfüllung verlangen. Je nach Voraussetzungen kommen später Rücktritt, Minderung oder Schadensersatz in Betracht.',q:'Was kann der Käufer zunächst verlangen?',a:'Nacherfüllung'},
{t:'Verwaltungsakt',text:'Vor dem Erlass eines belastenden Verwaltungsakts ist die betroffene Person grundsätzlich anzuhören. Außerdem muss die Behörde ihre Entscheidung nachvollziehbar begründen.',q:'Welche zwei Verfahrenselemente werden genannt?',a:'Anhörung und Begründung'}
];

const READ=[
{t:'Online-Kauf',text:'K bestellt in einem Online-Shop einen Laptop für 900 Euro. V bestätigt die Bestellung per E-Mail. Zwei Tage später erklärt V, der Preis sei versehentlich zu niedrig angegeben worden. V möchte nicht liefern. Zu prüfen ist, ob ein wirksamer Kaufvertrag zustande gekommen ist und ob V seine Erklärung anfechten kann.',qs:['Wie hoch ist der Kaufpreis?','Wie bestätigt V die Bestellung?','Welche zwei Rechtsfragen sind zu prüfen?']},
{t:'Mangelhafte Sache',text:'Nach der Lieferung stellt K fest, dass der Laptop regelmäßig abstürzt. K verlangt von V die Reparatur. V lehnt ab und verweist auf einen Ausschluss in seinen Allgemeinen Geschäftsbedingungen. Es ist zu prüfen, ob K Nacherfüllung verlangen kann und ob der Haftungsausschluss wirksam ist.',qs:['Welcher Mangel liegt vor?','Was verlangt K?','Welche Klausel muss geprüft werden?']},
{t:'Gewerbeerlaubnis',text:'A beantragt eine Gewerbeerlaubnis. Die Behörde lehnt den Antrag ab, ohne A vorher anzuhören. Der Bescheid enthält außerdem keine Begründung. Fraglich ist, ob der Verwaltungsakt formell rechtmäßig ist.',qs:['Was beantragt A?','Welche Verfahrensfehler liegen vor?','Welche Rechtmäßigkeitsart ist betroffen?']}
];

const SPEAK=[
'K könnte gegen V einen Anspruch auf Lieferung aus § 433 Absatz 1 BGB haben.',
'Ein Kaufvertrag setzt zwei übereinstimmende Willenserklärungen voraus.',
'Im Ergebnis ist festzuhalten, dass ein wirksamer Kaufvertrag zustande gekommen ist.',
'Nach herrschender Meinung ist die Vorschrift auf den vorliegenden Fall anwendbar.',
'Die Maßnahme ist nur rechtmäßig, wenn sie verhältnismäßig ist.'
];

function speak(text,rate=1){
  if(!('speechSynthesis' in window)){alert('پخش تلفظ در این مرورگر پشتیبانی نمی‌شود.');return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang='de-DE';u.rate=rate;u.pitch=1;
  const voices=speechSynthesis.getVoices();const de=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith('de'));
  if(de)u.voice=de;speechSynthesis.speak(u)
}
function go(v){S.view=v;save();document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===v));document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.v===v));render(v)}
function buildNav(){nav.innerHTML=V.map(v=>`<button class="nav ${v===S.view?'active':''}" data-v="${v}"><b>${N[v][0]}</b>${N[v][1]}</button>`).join('');document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>go(b.dataset.v))}
function pct(){const total=6;const d=Object.values(S.done).filter(Boolean).length;return Math.round(d/total*100)}
function render(v){
 const e=document.getElementById(v);
 if(v==='home')e.innerHTML=`<div class="hero"><h2>چهار مهارت واقعی + تلفظ</h2><p>این نسخه تلفظ آلمانی، شنیدار با سرعت قابل تنظیم، گفتار و تبدیل صوت به متن، خواندن تعاملی و Writing Lab را اجرا می‌کند.</p><button class="btn" onclick="go('pronunciation')">شروع با تلفظ</button></div>
 <div class="grid"><div class="card"><h3>واژگان تلفظ‌دار</h3><div class="metric">${TERMS.length}</div></div><div class="card"><h3>درس شنیداری</h3><div class="metric">${LISTEN.length}</div></div><div class="card"><h3>پیشرفت مهارت‌ها</h3><div class="metric">${pct()}٪</div><div class="bar"><span style="width:${pct()}%"></span></div></div></div>`;
 if(v==='pronunciation')e.innerHTML=`<div class="panel"><h3>Pronunciation Lab</h3><p class="muted">پخش طبیعی و آهسته با موتور گفتار مرورگر. روی هر مثال نیز می‌توان جداگانه کلیک کرد.</p>${TERMS.map((x,i)=>`<div class="term"><div><div class="de"><b>${x[0]}</b></div><div>${x[1]}</div><div class="example de" onclick="speak(${JSON.stringify(x[2])},.92)">${x[2]}</div></div><div class="audio-row"><button class="btn" onclick="speak(${JSON.stringify(x[0])},1)">طبیعی</button><button class="btn secondary" onclick="speak(${JSON.stringify(x[0])},.68)">آهسته</button></div></div>`).join('')}<button class="btn good" onclick="S.done.pronunciation=true;save();render('pronunciation')">ثبت تکمیل</button></div>`;
 if(v==='listening')e.innerHTML=`<div class="panel"><h3>Listening Lab</h3><div class="toolbar"><select class="select" id="li">${LISTEN.map((x,i)=>`<option value="${i}">${x.t}</option>`).join('')}</select><select class="select" id="speed"><option value=".7">آهسته</option><option value="1" selected>طبیعی</option><option value="1.2">سریع</option></select></div><div id="lb"></div></div>`; if(v==='listening'){const draw=()=>{const i=+li.value,x=LISTEN[i];lb.innerHTML=`<div class="audio-row"><button class="btn" onclick="speak(${JSON.stringify(x.text)},+speed.value)">▶ پخش</button><button class="btn secondary" onclick="document.getElementById('tr').hidden=!document.getElementById('tr').hidden">Transcript</button></div><div id="tr" class="transcript" hidden>${x.text}</div><h4>${x.q}</h4><input id="la" class="input" placeholder="پاسخ آلمانی"><button class="btn" onclick="const ok=la.value.toLowerCase().includes(${JSON.stringify(x.a.toLowerCase())});lf.className='feedback '+(ok?'ok':'warn');lf.textContent=ok?'درست است.':'پاسخ راهنما: ${x.a}'">بررسی</button><div id="lf"></div><button class="btn good" onclick="S.done.listening=true;save()">ثبت تکمیل</button>`};li.onchange=draw;draw()}
 if(v==='speaking')e.innerHTML=`<div class="panel"><h3>Speaking & Pronunciation Practice</h3><p class="muted">ابتدا نمونه را گوش دهید، سپس با میکروفن بخوانید. مرورگر متن تشخیص‌داده‌شده را نمایش می‌دهد.</p><select id="sp" class="select">${SPEAK.map((x,i)=>`<option value="${i}">${i+1}. ${x}</option>`).join('')}</select><div class="rec-box"><p class="de" id="target">${SPEAK[0]}</p><div class="audio-row"><button class="btn" onclick="speak(target.textContent,.9)">شنیدن نمونه</button><button class="btn bad" id="rec"><span class="rec-dot" id="dot"></span> شروع ضبط</button></div><div id="speechOut" class="feedback">${S.speechText||'هنوز گفتاری ثبت نشده است.'}</div><div id="sim"></div></div><button class="btn good" onclick="S.done.speaking=true;save()">ثبت تکمیل</button></div>`;
 if(v==='speaking'){sp.onchange=()=>target.textContent=SPEAK[+sp.value];rec.onclick=startRecognition}
 if(v==='reading')e.innerHTML=`<div class="panel"><h3>Reading Lab</h3><select id="ri" class="select">${READ.map((x,i)=>`<option value="${i}">${x.t}</option>`).join('')}</select><div id="rb"></div></div>`; if(v==='reading'){const draw=()=>{const x=READ[+ri.value];const sentences=x.text.split(/(?<=[.!?])\s+/);rb.innerHTML=`<div class="reading">${sentences.map(s=>`<span class="sentence" onclick="speak(${JSON.stringify(s)},.86)">${s}</span>`).join(' ')}</div>${x.qs.map((q,i)=>`<label>${i+1}. ${q}<input class="input" data-rq="${i}"></label>`).join('')}<button class="btn" onclick="S.done.reading=true;save();rf.className='feedback ok';rf.textContent='پاسخ‌ها ذخیره و تکمیل ثبت شد.'">ذخیره پاسخ‌ها</button><div id="rf"></div>`};ri.onchange=draw;draw()}
 if(v==='writing')e.innerHTML=`<div class="panel"><h3>Writing Lab</h3><p class="muted">یک پاسخ ۸۰ تا ۱۵۰ واژه‌ای درباره این سؤال بنویسید: Kann K Lieferung verlangen?</p><textarea id="wt" placeholder="K könnte gegen V ...">${S.writing||''}</textarea><button class="btn" onclick="checkWriting()">تحلیل متن</button><div id="wf"></div><button class="btn good" onclick="S.done.writing=true;save()">ثبت تکمیل</button></div>`;
 if(v==='progress')e.innerHTML=`<div class="grid"><div class="card"><h3>تلفظ</h3><div class="metric">${S.done.pronunciation?'✓':'—'}</div></div><div class="card"><h3>شنیدار</h3><div class="metric">${S.done.listening?'✓':'—'}</div></div><div class="card"><h3>گفتار</h3><div class="metric">${S.done.speaking?'✓':'—'}</div></div><div class="card"><h3>خواندن</h3><div class="metric">${S.done.reading?'✓':'—'}</div></div><div class="card"><h3>نوشتن</h3><div class="metric">${S.done.writing?'✓':'—'}</div></div><div class="card"><h3>کل</h3><div class="metric">${pct()}٪</div></div></div><button class="btn secondary" onclick="localStorage.removeItem(KEY);location.reload()">بازنشانی داده‌ها</button>`;
}
function startRecognition(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){speechOut.className='feedback bad';speechOut.textContent='تشخیص گفتار در این مرورگر پشتیبانی نمی‌شود. Chrome یا Edge اندروید را امتحان کنید.';return}
 const r=new SR();r.lang='de-DE';r.interimResults=false;r.maxAlternatives=1;dot.classList.add('on');rec.disabled=true;
 r.onresult=e=>{const t=e.results[0][0].transcript;S.speechText=t;save();speechOut.className='feedback ok';speechOut.textContent=t;const a=norm(target.textContent),b=norm(t);const common=a.split(' ').filter(w=>b.includes(w)).length;const score=Math.round(common/Math.max(1,a.split(' ').length)*100);sim.className='feedback '+(score>70?'ok':score>40?'warn':'bad');sim.textContent='شباهت واژگانی تقریبی: '+score+'٪'};
 r.onerror=e=>{speechOut.className='feedback bad';speechOut.textContent='خطا در ضبط: '+e.error};
 r.onend=()=>{dot.classList.remove('on');rec.disabled=false};r.start()
}
function norm(s){return s.toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,'').replace(/\s+/g,' ').trim()}
function checkWriting(){
 const t=wt.value.trim();S.writing=t;save();const words=t.split(/\s+/).filter(Boolean).length;let pts=0,notes=[];
 if(words>=60){pts+=20}else notes.push('متن کوتاه است؛ حداقل ۶۰ واژه بنویسید.');
 if(/könnte|zu prüfen|fraglich/i.test(t)){pts+=20}else notes.push('Obersatz روشن اضافه کنید.');
 if(/§\s*433|BGB/i.test(t)){pts+=20}else notes.push('مبنای قانونی § 433 BGB را ذکر کنید.');
 if(/Angebot|Annahme/i.test(t)){pts+=20}else notes.push('Angebot و Annahme را تحلیل کنید.');
 if(/folglich|im ergebnis|daher/i.test(t)){pts+=20}else notes.push('نتیجه‌گیری حقوقی اضافه کنید.');
 wf.className='feedback '+(pts>=80?'ok':pts>=50?'warn':'bad');wf.innerHTML=`<b>امتیاز ساختاری: ${pts}/100</b><br>${notes.length?notes.join('<br>'):'ساختار اصلی کامل است.'}`
}
let deferredPrompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;install.hidden=false});install.onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;install.hidden=true}};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js');
buildNav();go(S.view||'home');
</script>
</body></html>
