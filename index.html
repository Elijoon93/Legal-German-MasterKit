<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12344d"><meta name="description" content="Legal German MasterKit v3.0 — functional learning core"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>Legal German MasterKit v3.0</title><style>:root{--bg:#eef3f6;--card:#fff;--ink:#17324d;--muted:#637789;--line:#d7e2e8;--brand:#0b7285;--navy:#12344d;--soft:#e8f2f4;--ok:#2b8a3e;--warn:#b26a00;--bad:#c92a2a;--shadow:0 12px 32px #17324d14}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif;line-height:1.75;padding-bottom:80px}button,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,var(--navy),var(--brand));color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 14px #0002}.top h1{margin:0;font-size:1rem}.top small{display:block;color:#d9edf0;font-size:.72rem}.top button{min-height:44px;border:1px solid #ffffff80;background:transparent;color:#fff;border-radius:12px;padding:0 12px}.wrap{max-width:1080px;margin:auto;padding:14px}.view{display:none}.view.active{display:block}.hero,.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.hero{padding:22px;background:linear-gradient(135deg,#12344d,#0b7285);color:#fff}.hero h2{margin:0 0 8px;font-size:clamp(1.25rem,5vw,2rem)}.hero p{color:#d9edf0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.card,.panel{padding:16px}.card h3,.panel h3{margin:0 0 8px}.muted{color:var(--muted)}.metric{font-size:1.8rem;font-weight:800;color:var(--brand)}.btn{min-height:44px;border:0;border-radius:12px;background:var(--brand);color:#fff;padding:0 15px;cursor:pointer}.btn.secondary{background:var(--soft);color:var(--ink)}.btn.good{background:var(--ok)}.btn.warn{background:var(--warn)}.input,.select,textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;color:var(--ink)}textarea{min-height:180px;direction:ltr;text-align:left}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.toolbar>*{flex:1;min-width:150px}.option{display:block;border:1px solid var(--line);border-radius:12px;padding:10px;margin:7px 0;background:#fff}.step{background:var(--soft);border-right:4px solid var(--brand);border-radius:12px;padding:12px;margin:9px 0}.de{direction:ltr;text-align:left}.bar{height:10px;background:#dde8ed;border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;background:var(--brand)}.pill{display:inline-block;background:var(--soft);border-radius:999px;padding:4px 9px;font-size:.78rem;margin:2px}.feedback{background:var(--soft);border-radius:12px;padding:12px;margin-top:10px}.feedback.ok{border-right:4px solid var(--ok)}.feedback.warn{border-right:4px solid var(--warn)}.feedback.bad{border-right:4px solid var(--bad)}.flash{min-height:210px;display:grid;place-items:center;text-align:center}.flash .front{font-size:1.35rem;font-weight:800;direction:ltr}.rating{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.lesson-nav{display:flex;justify-content:space-between;gap:8px;margin-top:12px}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);background:#fffffffa;border-top:1px solid var(--line);padding:5px 4px calc(5px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px #0001}.nav{border:0;background:transparent;min-height:56px;font-size:.68rem;color:var(--muted)}.nav b{display:block;font-size:1.05rem}.nav.active{color:var(--brand);font-weight:700}@media(max-width:800px){.grid{grid-template-columns:1fr}.toolbar>*{width:100%}.rating{grid-template-columns:1fr}}@media(min-width:801px){body{padding-bottom:0}.bottom{position:sticky;top:69px;bottom:auto;max-width:1080px;margin:auto;border:1px solid var(--line);border-radius:14px;grid-template-columns:repeat(7,1fr)}}</style></head><body><header class="top"><div><h1>Legal German MasterKit v3.0</h1><small>Functional Core · LL.M. oec. Jena</small></div><button id="install" hidden>نصب</button></header><nav class="bottom" id="nav"></nav><main class="wrap"><section id="home" class="view active"></section><section id="diagnostic" class="view"></section><section id="learn" class="view"></section><section id="review" class="view"></section><section id="case" class="view"></section><section id="writing" class="view"></section><section id="progress" class="view"></section></main><script>const KEY='lgmk-v3';let S=JSON.parse(localStorage.getItem(KEY)||'{}');S={view:'home',diag:null,lesson:0,step:0,done:[],cards:{},caseText:'',writing:'',history:[],...S};const save=()=>localStorage.setItem(KEY,JSON.stringify(S));const V=['home','diagnostic','learn','review','case','writing','progress'];const N={home:['⌂','خانه'],diagnostic:['◎','تعیین سطح'],learn:['▤','درس'],review:['⟳','مرور'],case:['⚖','پرونده'],writing:['✎','نگارش'],progress:['◔','پیشرفت']};const DIAG=[['کدام جمله رسمی‌تر است؟',['Ich denke, das ist falsch.','Es ist davon auszugehen, dass die Auffassung nicht überzeugt.','Das passt nicht so.'],1],['برای طرح مسئله حقوقی کدام مناسب است؟',['Zu prüfen ist, ob ein Anspruch besteht.','Was passiert jetzt?','Ich habe eine Frage.'],0],['Konjunktiv I بیشتر برای چیست؟',['نقل غیرمستقیم','فرمان','گذشته ساده'],0],['کدام ساختار Gutachtenstil درست است؟',['Obersatz–Definition–Subsumtion–Ergebnis','نتیجه–مثال–مقدمه','تعریف–منبع–عنوان'],0],['مفهوم Anspruch چیست؟',['حق مطالبه حقوقی','جلسه دادگاه','آیین‌نامه'],0],['کدام عبارت برای نظر غالب است؟',['Nach herrschender Meinung …','Ich finde …','Man sagt vielleicht …'],0],['کدام جمله مجهول است؟',['Der Antrag wird geprüft.','Die Behörde prüft den Antrag.','Prüfe den Antrag!'],0],['برای نتیجه‌گیری کدام مناسب‌تر است؟',['Im Ergebnis ist festzuhalten, dass …','Na ja, fertig.','Das war alles.'],0],['Subsumtion یعنی چه؟',['تطبیق وقایع با معیار حقوقی','فهرست منابع','ترجمه تحت‌اللفظی'],0],['کدام عبارت علمی‌تر است؟',['Die Gegenauffassung überzeugt nicht, weil …','Das ist Quatsch.','Ich mag diese Meinung nicht.'],0]];const LES=[{t:'Anspruch und Gutachtenstil',goal:'ساخت پاسخ حقوقی چهارمرحله‌ای',steps:[['مفهوم','Ein Anspruch ist das Recht, von einem anderen ein Tun oder Unterlassen zu verlangen.','حق مطالبه، اختیار قانونی درخواست انجام یا ترک عمل از دیگری است.'],['Obersatz','K könnte gegen V einen Anspruch auf Lieferung aus § 433 Abs. 1 BGB haben.','ابتدا ادعا و مبنای قانونی مطرح می‌شود.'],['Definition','Ein Kaufvertrag setzt zwei übereinstimmende Willenserklärungen voraus.','معیار حقوقی به‌صورت دقیق تعریف می‌شود.'],['Subsumtion','K bestellte den Laptop; V bestätigte die Bestellung. Damit liegen Angebot und Annahme vor.','وقایع با معیار تطبیق داده می‌شوند.'],['Ergebnis','Folglich besteht grundsätzlich ein Anspruch auf Lieferung.','نتیجه کوتاه و روشن بیان می‌شود.']]},{t:'Juristische Verknüpfungen',goal:'ساخت استدلال منسجم',steps:[['Eröffnung','Zunächst ist zu prüfen, ob …','آغاز بررسی'],['Voraussetzung','Dies setzt voraus, dass …','بیان شرط'],['Gegenargument','Dagegen spricht jedoch, dass …','بیان استدلال مخالف'],['Abwägung','Bei einer Abwägung überwiegt …','موازنه'],['Schluss','Im Ergebnis ist festzuhalten, dass …','نتیجه‌گیری']]},{t:'Wissenschaftlicher Stil',goal:'تبدیل زبان محاوره‌ای به دانشگاهی',steps:[['ضعیف','Ich finde die Entscheidung falsch.','محاوره‌ای و شخصی'],['بهتر','Die Entscheidung überzeugt nicht.','رسمی‌تر'],['علمی','Die Entscheidung überzeugt insbesondere deshalb nicht, weil sie den Schutzzweck der Norm unberücksichtigt lässt.','دارای دلیل حقوقی'],['ارجاع','Vgl. hierzu die abweichende Auffassung in der Literatur.','ارجاع به ادبیات'],['جمع‌بندی','Zusammenfassend lässt sich feststellen, dass …','جمع‌بندی علمی']]}];const DECK=[['der Anspruch','حق مطالبه','K hat einen Anspruch auf Lieferung.'],['die Voraussetzung','شرط','Voraussetzung ist ein wirksamer Vertrag.'],['die Willenserklärung','اظهار اراده','Angebot und Annahme sind Willenserklärungen.'],['die Subsumtion','تطبیق','Die Subsumtion verbindet Norm und Sachverhalt.'],['die herrschende Meinung','نظر غالب','Nach herrschender Meinung ist die Norm anwendbar.'],['die Gegenauffassung','نظر مخالف','Die Gegenauffassung überzeugt nicht.'],['die Rechtsprechung','رویه قضایی','Die Rechtsprechung des BGH ist zu beachten.'],['die Verhältnismäßigkeit','تناسب','Die Maßnahme muss verhältnismäßig sein.'],['die Anhörung','استماع اظهارات','Vor dem Bescheid ist eine Anhörung erforderlich.'],['die Rechtsfolge','اثر حقوقی','Die Rechtsfolge ist die Nichtigkeit.'],['die Begründetheit','موجه‌بودن دعوا','Die Klage ist begründet.'],['die Zulässigkeit','قابل‌پذیرش بودن','Zunächst ist die Zulässigkeit zu prüfen.']];function due(i){const c=S.cards[i];return !c||!c.next||c.next<=Date.now()}function rate(i,r){const days=r===0?0:r===1?2:7;S.cards[i]={last:r,next:Date.now()+days*86400000,reps:(S.cards[i]?.reps||0)+1};S.history.push({type:'review',date:Date.now(),score:r});save();render('review')}function score(){return Math.min(100,Math.round(((S.done.length*8)+(Object.keys(S.cards).length*3)+(S.diag?10:0)+(S.caseText?10:0)+(S.writing?10:0))))}function go(v){S.view=v;save();document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===v));document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.v===v));render(v)}function nav(){nav.innerHTML=V.map(v=>`<button class="nav ${v===S.view?'active':''}" data-v="${v}"><b>${N[v][0]}</b>${N[v][1]}</button>`).join('');document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>go(b.dataset.v))}function render(v){const e=document.getElementById(v);if(v==='home'){const level=S.diag===null?'نامشخص':S.diag<5?'B1/B2 پایه':S.diag<8?'B2 قوی':'C1 ورودی';e.innerHTML=`<div class="hero"><h2>این نسخه یک مسیر آموزشی واقعی دارد</h2><p>تعیین سطح، درس مرحله‌ای، مرور فاصله‌دار، حل پرونده و بازخورد نگارشی در یک چرخه واحد.</p><button class="btn" onclick="go('${S.diag===null?'diagnostic':'learn'}')">${S.diag===null?'شروع تعیین سطح':'ادامه مسیر'}</button></div><div class="grid"><div class="card"><h3>سطح فعلی</h3><div class="metric">${level}</div></div><div class="card"><h3>مرور سررسید</h3><div class="metric">${DECK.filter((_,i)=>due(i)).length}</div></div><div class="card"><h3>پیشرفت</h3><div class="metric">${score()}٪</div><div class="bar"><span style="width:${score()}%"></span></div></div></div>`}if(v==='diagnostic'){e.innerHTML=`<div class="panel"><h3>تعیین سطح کاربردی</h3><p class="muted">۱۰ سؤال برای تشخیص آمادگی زبان حقوقی. نتیجه مسیر درس را تعیین می‌کند.</p><form id="df">${DIAG.map((q,i)=>`<fieldset class="option"><legend>${i+1}. ${q[0]}</legend>${q[1].map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join('')}</fieldset>`).join('')}<button class="btn">محاسبه نتیجه</button></form>${S.diag!==null?`<div class="feedback ok">امتیاز قبلی: ${S.diag} از ۱۰</div>`:''}</div>`;df.onsubmit=x=>{x.preventDefault();let n=0;DIAG.forEach((q,i)=>{const a=new FormData(df).get('q'+i);if(Number(a)===q[2])n++});S.diag=n;S.history.push({type:'diagnostic',date:Date.now(),score:n});save();alert('امتیاز شما: '+n+'/10');go('learn')}}if(v==='learn'){const l=LES[S.lesson],st=l.steps[S.step];e.innerHTML=`<div class="panel"><span class="pill">درس ${S.lesson+1} از ${LES.length}</span><h3>${l.t}</h3><p>${l.goal}</p><div class="step"><strong>${st[0]}</strong><p class="de">${st[1]}</p><p>${st[2]}</p></div><div class="lesson-nav"><button class="btn secondary" id="prev">مرحله قبل</button><button class="btn" id="next">${S.step===l.steps.length-1?'پایان درس':'مرحله بعد'}</button></div></div>`;prev.onclick=()=>{if(S.step>0)S.step--;else if(S.lesson>0){S.lesson--;S.step=LES[S.lesson].steps.length-1}save();render('learn')};next.onclick=()=>{if(S.step<l.steps.length-1)S.step++;else{if(!S.done.includes(S.lesson))S.done.push(S.lesson);if(S.lesson<LES.length-1){S.lesson++;S.step=0}else alert('دروس هسته فعلی کامل شد. اکنون مرور و پرونده را انجام دهید.')}save();render('learn')}}if(v==='review'){const i=DECK.findIndex((_,x)=>due(x));if(i<0){e.innerHTML=`<div class="panel"><h3>مرور امروز کامل است</h3><p>همه کارت‌ها تا موعد بعدی زمان‌بندی شده‌اند.</p></div>`}else{const c=DECK[i];e.innerHTML=`<div class="panel"><h3>مرور فاصله‌دار</h3><div class="flash"><div><div class="front">${c[0]}</div><button class="btn secondary" id="show">نمایش پاسخ</button><div id="back" hidden><h3>${c[1]}</h3><p class="de">${c[2]}</p></div></div></div><div class="rating" id="rating" hidden><button class="btn warn" onclick="rate(${i},0)">دوباره</button><button class="btn" onclick="rate(${i},1)">متوسط</button><button class="btn good" onclick="rate(${i},2)">آسان</button></div></div>`;show.onclick=()=>{back.hidden=false;rating.hidden=false;show.hidden=true}}}if(v==='case'){e.innerHTML=`<div class="panel"><h3>پرونده عملی: Kaufvertrag</h3><div class="step"><p class="de">K bestellt bei V einen Laptop für 900 Euro. V bestätigt per E-Mail. Später verweigert V die Lieferung, weil der Marktpreis gestiegen ist.</p><p><strong>سؤال:</strong> Kann K Lieferung verlangen?</p></div><p>پاسخ را با ساختار Obersatz، Definition، Subsumtion و Ergebnis بنویسید.</p><textarea id="ct" placeholder="K könnte gegen V ...">${S.caseText}</textarea><button class="btn" id="checkCase">ارزیابی پاسخ</button><div id="cf"></div></div>`;ct.oninput=()=>{S.caseText=ct.value;save()};checkCase.onclick=()=>{const t=ct.value.toLowerCase(),keys=['könnte','§ 433','kaufvertrag','angebot','annahme','folglich'];const hit=keys.filter(k=>t.includes(k));const p=Math.round(hit.length/keys.length*100);cf.innerHTML=`<div class="feedback ${p>=70?'ok':p>=40?'warn':'bad'}"><strong>امتیاز ساختاری: ${p}٪</strong><p>موارد شناسایی‌شده: ${hit.join('، ')||'هیچ‌کدام'}</p><p>پاسخ نمونه: <span class="de">K könnte gegen V einen Anspruch auf Lieferung aus § 433 Abs. 1 BGB haben. Ein Kaufvertrag setzt Angebot und Annahme voraus. K bestellte; V bestätigte. Folglich ist ein Kaufvertrag zustande gekommen.</span></p></div>`;S.history.push({type:'case',date:Date.now(),score:p});save()}}if(v==='writing'){e.innerHTML=`<div class="panel"><h3>Writing Lab</h3><select class="select" id="tpl"><option value="seminar">Seminararbeit</option><option value="fall">Falllösung</option><option value="email">E-Mail an Professor</option></select><textarea id="wt" placeholder="متن آلمانی خود را بنویسید...">${S.writing}</textarea><button class="btn" id="an">تحلیل متن</button><div id="wf"></div></div>`;wt.oninput=()=>{S.writing=wt.value;save()};an.onclick=()=>{const t=wt.value.trim(),words=t?t.split(/\s+/).length:0;let f=[];if(words<40)f.push('متن برای ارزیابی جدی کوتاه است.');if(/ich finde|super|cool|quatsch/i.test(t))f.push('عبارت محاوره‌ای یا شخصی شناسایی شد.');if(!/(daher|folglich|jedoch|allerdings|zunächst|im ergebnis)/i.test(t))f.push('پیوند استدلالی کافی دیده نشد.');if(tpl.value==='fall'&&!/(könnte|zu prüfen|voraussetzung|folglich)/i.test(t))f.push('ساختار Gutachtenstil کامل نیست.');if(tpl.value==='seminar'&&!/(untersucht|auffassung|literatur|zusammenfassend)/i.test(t))f.push('نشانه‌های نگارش علمی و مرور دیدگاه‌ها کم است.');if(tpl.value==='email'&&!/(sehr geehrt|mit freundlichen grüßen|erkundigen|anbei)/i.test(t))f.push('ساختار ایمیل رسمی ناقص است.');wf.innerHTML=`<div class="feedback ${f.length?'warn':'ok'}"><strong>${words} واژه</strong>${f.length?'<ul>'+f.map(x=>'<li>'+x+'</li>').join('')+'</ul>':'<p>شاخص‌های اصلی این قالب شناسایی شد.</p>'}</div>`;S.history.push({type:'writing',date:Date.now(),score:Math.max(0,100-f.length*20)});save()}}if(v==='progress'){const reviews=Object.values(S.cards).reduce((a,c)=>a+(c.reps||0),0);e.innerHTML=`<div class="grid"><div class="card"><h3>امتیاز تعیین سطح</h3><div class="metric">${S.diag??'—'}/10</div></div><div class="card"><h3>دروس کامل</h3><div class="metric">${S.done.length}/${LES.length}</div></div><div class="card"><h3>مرور انجام‌شده</h3><div class="metric">${reviews}</div></div></div><div class="panel" style="margin-top:12px"><h3>داده‌های ذخیره‌شده</h3><p>پاسخ پرونده: ${S.caseText?'ذخیره شده':'ثبت نشده'} · متن نگارش: ${S.writing?'ذخیره شده':'ثبت نشده'}</p><button class="btn secondary" id="exp">خروجی JSON</button></div>`;exp.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='legal-german-progress.json';a.click()}}}nav();go(S.view);if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js');let deferred;addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;install.hidden=false});install.onclick=async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null;install.hidden=true}};</script></body></html>
