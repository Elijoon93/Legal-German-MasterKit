<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12344d"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>Legal German MasterKit v5.0</title><style>:root{--bg:#eef3f6;--c:#fff;--i:#17324d;--m:#637789;--l:#d7e2e8;--b:#0b7285;--n:#12344d;--s:#e8f2f4;--ok:#2b8a3e;--w:#b26a00;--bad:#c92a2a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--i);font-family:Tahoma,Arial,sans-serif;line-height:1.75;padding-bottom:78px}button,input,textarea{font:inherit}.top{position:sticky;top:0;z-index:9;background:linear-gradient(135deg,var(--n),var(--b));color:#fff;padding:12px 14px;display:flex;justify-content:space-between}.top h1{margin:0;font-size:1rem}.top small{display:block;color:#d8edf0}.wrap{max-width:1050px;margin:auto;padding:14px}.v{display:none}.v.a{display:block}.hero,.p,.card{background:var(--c);border:1px solid var(--l);border-radius:18px;padding:16px;box-shadow:0 10px 28px #17324d14}.hero{background:linear-gradient(135deg,var(--n),var(--b));color:#fff}.hero p{color:#d8edf0}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.metric{font-size:1.8rem;font-weight:800;color:var(--b)}.btn{min-height:44px;border:0;border-radius:12px;background:var(--b);color:#fff;padding:0 14px;margin:4px}.btn.s{background:var(--s);color:var(--i)}.btn.ok{background:var(--ok)}textarea{width:100%;min-height:170px;border:1px solid var(--l);border-radius:12px;padding:10px;direction:ltr;text-align:left}.de{direction:ltr;text-align:left}.box,.fb{background:var(--s);border-radius:12px;padding:11px;margin:8px 0}.fb.ok{border-right:4px solid var(--ok)}.fb.w{border-right:4px solid var(--w)}.fb.bad{border-right:4px solid var(--bad)}.opt{display:block;border:1px solid var(--l);border-radius:12px;padding:9px;margin:6px 0}.row{display:grid;grid-template-columns:1fr 1fr 1.5fr auto;gap:8px;align-items:center;border-bottom:1px solid var(--l);padding:9px 0}.bar{height:10px;background:#dce7eb;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:var(--b)}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--l);z-index:10}.nav button{border:0;background:transparent;min-height:60px;color:var(--m);font-size:.7rem}.nav button b{display:block;font-size:1.05rem}.nav button.a{color:var(--b);font-weight:700}@media(max-width:760px){.g{grid-template-columns:1fr}.row{grid-template-columns:1fr auto}.row .fa,.row .ex{grid-column:1/-1}}@media(min-width:761px){body{padding-bottom:0}.nav{position:sticky;top:58px;max-width:1050px;margin:auto;border:1px solid var(--l);border-radius:14px;grid-template-columns:repeat(7,1fr)}}</style></head><body><header class="top"><div><h1>Legal German MasterKit v5.0</h1><small>Complete Module 01 · Vertragsrecht / Kaufvertrag</small></div></header><nav class="nav" id="nav"></nav><main class="wrap"><section id="home" class="v a"></section><section id="lesson" class="v"></section><section id="vocab" class="v"></section><section id="reading" class="v"></section><section id="case" class="v"></section><section id="writing" class="v"></section><section id="exam" class="v"></section></main><script>const K='lgmk-v5-m1';let S=JSON.parse(localStorage.getItem(K)||'{}');S={view:'home',step:0,done:[],voc:{},read:{},case:'',write:'',exam:null,...S};const save=()=>localStorage.setItem(K,JSON.stringify(S));const V=['home','lesson','vocab','reading','case','writing','exam'],N={home:['⌂','خانه'],lesson:['▤','درس'],vocab:['A','واژگان'],reading:['◫','خواندن'],case:['⚖','پرونده'],writing:['✎','نگارش'],exam:['✓','آزمون']};const L=[['تعهدات اصلی § 433 BGB','§ 433 BGB ordnet die Hauptpflichten von Verkäufer und Käufer.',['Verkäufer: Übergabe und Übereignung','Verkäufer: Freiheit von Sach- und Rechtsmängeln','Käufer: Kaufpreiszahlung und Abnahme']],['Obersatz','K könnte gegen V einen Anspruch auf Übergabe und Übereignung aus § 433 Abs. 1 Satz 1 BGB haben.',['مدعی، طرف مقابل، خواسته و مبنای قانونی را ذکر کنید.']],['Vertragsschluss','Ein Kaufvertrag kommt durch Angebot und Annahme zustande.',['ایجاب باید معین باشد.','قبول باید با ایجاب منطبق باشد.']],['Subsumtion','K bestellte den Laptop. V bestätigte die Bestellung. Damit liegen Angebot und Annahme vor.',['واقعه را به معیار حقوقی وصل کنید.','از damit، somit و folglich استفاده کنید.']],['Ergebnis','Im Ergebnis besteht der Anspruch auf Lieferung.',['نتیجه کوتاه و هماهنگ با Obersatz باشد.']]];const W=[['der Kaufvertrag','قرارداد خرید','Der Kaufvertrag verpflichtet beide Parteien.'],['der Verkäufer','فروشنده','Der Verkäufer muss die Sache übergeben.'],['der Käufer','خریدار','Der Käufer muss den Kaufpreis zahlen.'],['die Übergabe','تحویل','Die Übergabe ist geschuldet.'],['die Übereignung','انتقال مالکیت','Die Übereignung verschafft Eigentum.'],['der Kaufpreis','ثمن','Der Kaufpreis ist zu zahlen.'],['die Abnahme','تحویل‌گرفتن','Der Käufer ist zur Abnahme verpflichtet.'],['der Sachmangel','عیب مادی','Ein Sachmangel löst Rechte aus.'],['der Rechtsmangel','عیب حقوقی','Die Sache muss frei von Rechtsmängeln sein.'],['das Angebot','ایجاب','Das Angebot muss bestimmt sein.'],['die Annahme','قبول','Die Annahme muss entsprechen.'],['die Willenserklärung','اظهار اراده','Ein Vertrag setzt Willenserklärungen voraus.'],['der Anspruch','حق مطالبه','K hat einen Anspruch.'],['die Fälligkeit','سررسید','Der Anspruch ist fällig.'],['die Einwendung','دفاع ماهوی','Eine Einwendung kann den Anspruch ausschließen.']];const TEXT='K bestellt im Online-Shop des V einen Laptop für 900 Euro. V sendet eine E-Mail: „Wir bestätigen Ihre Bestellung. Der Vertrag ist zustande gekommen.“ Zwei Tage später verlangt V 1.100 Euro. K verlangt Lieferung zum vereinbarten Preis.';const R=[['Welche Erklärungen sind Angebot und Annahme?','سفارش K و تأیید صریح V'],['Welchen Anspruch verlangt K?','تحویل و انتقال مالکیت به قیمت ۹۰۰ یورو'],['Welche Anspruchsgrundlage ist zentral?','§ 433 Abs. 1 Satz 1 BGB']];const Q=[['تعهد فروشنده؟',['تحویل و انتقال مالکیت بدون عیب','فقط فاکتور','فقط دریافت پول'],0],['تعهد خریدار؟',['پرداخت ثمن و تحویل‌گرفتن','انتقال مالکیت','رفع عیب'],0],['انعقاد قرارداد؟',['Angebot und Annahme','فاکتور','پرداخت'],0],['Obersatz مناسب؟',['K könnte gegen V einen Anspruch aus § 433 Abs. 1 BGB haben.','K will Ware.','Ware kostet Geld.'],0],['Subsumtion؟',['تطبیق وقایع با معیار','نقل قانون','فهرست منابع'],0],['نتیجه؟',['Im Ergebnis besteht der Anspruch.','Zunächst …','Unter … versteht man …'],0],['Sachmangel؟',['عدم انطباق با الزامات','تأخیر خریدار','نبود دادخواست'],0],['انتقال مالکیت؟',['Übereignung','Übergabe','Annahme'],0],['سررسید؟',['Fälligkeit','Abnahme','Einwendung'],0],['ساختار صحیح؟',['Obersatz–Definition–Subsumtion–Ergebnis','نتیجه–عنوان','منبع–نظر'],0]];function m(){return Math.round(([S.done.length/L.length,Object.keys(S.voc).length/W.length,Object.keys(S.read).length/R.length,S.case.length>120?1:0,S.write.length>100?1:0,S.exam!==null?1:0].reduce((a,b)=>a+b,0)/6)*100)}function go(v){S.view=v;save();document.querySelectorAll('.v').forEach(x=>x.classList.toggle('a',x.id===v));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('a',x.dataset.v===v));render(v)}nav.innerHTML=V.map(v=>`<button data-v="${v}"><b>${N[v][0]}</b>${N[v][1]}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.v));function render(v){const e=document.getElementById(v);if(v==='home')e.innerHTML=`<div class="hero"><h2>ماژول کامل Vertragsrecht / Kaufvertrag</h2><p>۵ درس، ۱۵ واژه، متن، پرونده، Writing Lab و آزمون ۱۰ سؤالی.</p><button class="btn" onclick="go('lesson')">شروع</button></div><div class="g"><div class="card"><h3>تسلط</h3><div class="metric">${m()}٪</div><div class="bar"><span style="width:${m()}%"></span></div></div><div class="card"><h3>درس</h3><div class="metric">${S.done.length}/5</div></div><div class="card"><h3>واژگان</h3><div class="metric">${Object.keys(S.voc).length}/15</div></div></div>`;if(v==='lesson'){let i=Math.min(S.step,4),x=L[i];e.innerHTML=`<div class="p"><h3>${i+1}. ${x[0]}</h3><div class="box de">${x[1]}</div><ul>${x[2].map(z=>`<li>${z}</li>`).join('')}</ul><button class="btn s" onclick="S.step=Math.max(0,S.step-1);save();render('lesson')">قبلی</button><button class="btn ok" onclick="if(!S.done.includes(${i}))S.done.push(${i});S.step=Math.min(4,S.step+1);save();render('lesson')">یاد گرفتم / بعدی</button></div>`}if(v==='vocab')e.innerHTML=`<div class="p"><h3>واژگان هسته</h3>${W.map((x,i)=>`<div class="row"><b class="de">${x[0]}</b><span class="fa">${x[1]}</span><span class="ex de">${x[2]}</span><button class="btn ${S.voc[i]?'ok':'s'}" onclick="S.voc[${i}]=!S.voc[${i}];save();render('vocab')">${S.voc[i]?'ثبت':'بلدم'}</button></div>`).join('')}</div>`;if(v==='reading')e.innerHTML=`<div class="p"><h3>Lesen</h3><div class="box de">${TEXT}</div>${R.map((x,i)=>`<b>${x[0]}</b><textarea oninput="S.read[${i}]=this.value;save()">${S.read[i]||''}</textarea><details><summary>پاسخ راهنما</summary><div class="fb ok">${x[1]}</div></details>`).join('')}</div>`;if(v==='case')e.innerHTML=`<div class="p"><h3>Fallbearbeitung</h3><div class="box de">${TEXT}</div><p>Prüfen Sie, ob K gegen V einen Anspruch auf Lieferung für 900 Euro aus § 433 Abs. 1 Satz 1 BGB hat.</p><textarea oninput="S.case=this.value;save()">${S.case}</textarea><button class="btn" onclick="caseCheck()">ارزیابی ساختاری</button><div id="cf"></div><details><summary>پاسخ نمونه</summary><div class="box de">K könnte gegen V einen Anspruch auf Übergabe und Übereignung aus § 433 Abs. 1 Satz 1 BGB haben. Ein Kaufvertrag kommt durch Angebot und Annahme zustande. K gab durch die Bestellung ein Angebot ab. V nahm dieses durch die ausdrückliche Bestätigung an. Somit besteht ein wirksamer Kaufvertrag. K kann Lieferung zum vereinbarten Preis verlangen.</div></details></div>`;if(v==='writing')e.innerHTML=`<div class="p"><h3>Writing Lab</h3><div class="box de">Ich finde, V muss den Laptop geben, weil er ja zugesagt hat.</div><textarea oninput="S.write=this.value;save()">${S.write}</textarea><button class="btn" onclick="writeCheck()">بررسی</button><div id="wf"></div><details><summary>نمونه</summary><div class="box de">Es ist davon auszugehen, dass V zur Lieferung verpflichtet ist, weil durch Bestellung und Bestätigung ein wirksamer Kaufvertrag zustande gekommen ist.</div></details></div>`;if(v==='exam'){e.innerHTML=`<div class="p"><h3>آزمون پایان ماژول</h3><form id="f">${Q.map((x,i)=>`<fieldset class="opt"><legend>${i+1}. ${x[0]}</legend>${x[1].map((z,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}"> ${z}</label>`).join('')}</fieldset>`).join('')}<button class="btn">تصحیح</button></form>${S.exam!==null?`<div class="fb ${S.exam>=8?'ok':'w'}">${S.exam} از 10</div>`:''}</div>`;f.onsubmit=a=>{a.preventDefault();let n=0;Q.forEach((x,i)=>{let r=f.querySelector(`input[name=q${i}]:checked`);if(r&&+r.value===x[2])n++});S.exam=n;save();render('exam')}}}function caseCheck(){let t=S.case.toLowerCase(),a=[['Obersatz',/könnte|anspruch/],['§ 433',/433/],['Angebot/Annahme',/angebot.*annahme|annahme.*angebot/],['Subsumtion',/bestell|bestätig/],['Ergebnis',/somit|folglich|verlangen/]];cf.innerHTML=a.map(x=>`<div class="fb ${x[1].test(t)?'ok':'w'}">${x[1].test(t)?'✓':'△'} ${x[0]}</div>`).join('')}function writeCheck(){let t=S.write,b=/ich finde| ja |cool|quatsch/i.test(t),l=/weil|daher|somit|folglich/i.test(t),r=/vertrag|anspruch|verpflichtet|zustande gekommen/i.test(t);wf.innerHTML=`<div class="fb ${!b?'ok':'bad'}">${!b?'✓ لحن رسمی':'لحن شخصی/محاوره‌ای'}</div><div class="fb ${l?'ok':'w'}">${l?'✓ رابط استدلالی':'رابط استدلالی لازم است'}</div><div class="fb ${r?'ok':'w'}">${r?'✓ واژه حقوقی':'واژه حقوقی دقیق لازم است'}</div>`}go(S.view||'home');if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js');</script></body></html>
