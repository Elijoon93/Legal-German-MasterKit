<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d3b4a"><meta name="description" content="Legal German MasterKit v7.5 Core Learning Platform"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>Legal German MasterKit v7.5</title><style>:root{--b:#0b7285;--n:#0d3b4a;--bg:#eef4f6;--c:#fff;--i:#17324d;--m:#647789;--l:#d5e1e7;--s:#e7f3f5;--ok:#2b8a3e;--w:#b26a00;--bad:#c92a2a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--i);font-family:Tahoma,Arial,sans-serif;line-height:1.75;padding-bottom:82px}button,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,var(--n),var(--b));color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}.top h1{margin:0;font-size:1rem}.top small{display:block;color:#d9edf0}.top button,.btn{min-height:44px;border:0;border-radius:12px;padding:0 14px;cursor:pointer}.top button{border:1px solid #fff7;background:#fff1;color:#fff}.btn{background:var(--b);color:#fff;margin:3px}.btn.s{background:var(--s);color:var(--i)}.btn.ok{background:var(--ok)}.btn.w{background:var(--w)}.btn.bad{background:var(--bad)}.wrap{max-width:1120px;margin:auto;padding:14px}.v{display:none}.v.a{display:block}.hero,.card,.panel{background:var(--c);border:1px solid var(--l);border-radius:18px;padding:16px;box-shadow:0 10px 28px #17324d14}.hero{background:linear-gradient(135deg,#12344d,var(--b));color:#fff}.hero p{color:#d9edf0}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.metric{font-size:1.8rem;font-weight:800;color:var(--b)}.bar{height:10px;background:#dce7eb;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:var(--b)}.box,.fb{background:var(--s);border-radius:12px;padding:11px;margin:8px 0}.de{direction:ltr;text-align:left}.pill{display:inline-block;background:var(--s);border-radius:999px;padding:3px 8px;margin:2px;font-size:.78rem}.input,textarea,select{width:100%;min-height:46px;border:1px solid var(--l);border-radius:12px;padding:10px;background:#fff}textarea{min-height:180px;direction:ltr;text-align:left}.rating{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:#fff;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--l)}.nav button{border:0;background:transparent;min-height:60px;color:var(--m);font-size:.69rem}.nav button b{display:block;font-size:1.05rem}.nav button.a{color:var(--b);font-weight:700}@media(max-width:800px){.g{grid-template-columns:1fr}.rating{grid-template-columns:1fr}}@media(min-width:801px){body{padding-bottom:0}.nav{position:sticky;top:66px;max-width:1120px;margin:auto;border:1px solid var(--l);border-radius:14px;grid-template-columns:repeat(8,1fr)}}</style></head><body><header class="top"><div><h1>Legal German MasterKit v7.5</h1><small>Core Learning Platform · LL.M. oec. Jena</small></div><div><button id="install" hidden>نصب</button><button onclick="backup()">پشتیبان</button></div></header><nav id="nav" class="nav"></nav><main class="wrap"><section id="home" class="v a"></section><section id="path" class="v"></section><section id="lesson" class="v"></section><section id="review" class="v"></section><section id="skills" class="v"></section><section id="case" class="v"></section><section id="writing" class="v"></section><section id="stats" class="v"></section></main><input id="restore" type="file" accept="application/json" hidden><script>'use strict';const D='lgmk-core',ST='state';let db,S={view:'home',lesson:0,step:0,done:[],cards:{},skills:{},caseText:'',writing:'',minutes:0,history:[]};const LES=[['Kaufvertrag und Anspruch','B2',['Introduction|قرارداد خرید تعهدات اصلی دو طرف را ایجاد می‌کند.|Der Kaufvertrag begründet gegenseitige Hauptpflichten.','Vocabulary|Anspruch، Angebot، Annahme، Übergabe، Übereignung|K hat einen Anspruch auf Lieferung.','Pronunciation|عبارت Obersatz را بشنوید و تکرار کنید.|K könnte gegen V einen Anspruch aus § 433 BGB haben.','Grammar|Konjunktiv II برای احتمال حقوقی.|K könnte einen Anspruch haben.','Reading|K bestellt einen Laptop. V bestätigt, liefert aber nicht.|Welche Willenserklärungen liegen vor?','Listening|کلیدواژه‌ها را پس از شنیدن ثبت کنید.|Ein Kaufvertrag kommt durch Angebot und Annahme zustande.','Speaking|مسئله را شفاهی بیان کنید.|Zu prüfen ist, ob K Lieferung verlangen kann.','Writing|یک Obersatz و Subsumtion بنویسید.|Damit liegen Angebot und Annahme vor.','Case Study|ODSE را اعمال کنید.|Obersatz – Definition – Subsumtion – Ergebnis','Quiz|مبنای مطالبه چیست؟|§ 433 Abs. 1 BGB','Summary|قرارداد از Angebot و Annahme تشکیل می‌شود.|Im Ergebnis besteht der Anspruch.','Review|واژگان به مرور فاصله‌دار می‌روند.|Anspruch · Angebot · Annahme']],['Sachmangel und Käuferrechte','B2/C1',['Introduction|عدم انطباق کالا می‌تواند Sachmangel باشد.|Die Sache ist mangelhaft.','Vocabulary|Sachmangel، Nacherfüllung، Rücktritt، Minderung|Der Käufer verlangt Nacherfüllung.','Pronunciation|حقوق خریدار را تکرار کنید.|Nacherfüllung, Rücktritt und Minderung.','Grammar|Modalverben برای حق و الزام.|Der Käufer kann Nacherfüllung verlangen.','Reading|کالا با مشخصات توافقی منطبق نیست.|Liegt ein Sachmangel vor?','Listening|مهلت مناسب را بشنوید.|Der Käufer setzt eine angemessene Frist.','Speaking|ترتیب حقوق خریدار را توضیح دهید.|Zunächst kommt Nacherfüllung in Betracht.','Writing|عدم انطباق را Subsumtion کنید.|Die vereinbarte Beschaffenheit fehlt.','Case Study|عیب، مهلت و حقوق ثانویه.|Mangel – Frist – Rücktritt','Quiz|حق اولیه چیست؟|Nacherfüllung','Summary|حقوق ثانویه شروط بیشتری دارند.|Sekundärrechte setzen weitere Voraussetzungen voraus.','Review|واژگان عیب مرور می‌شوند.|Sachmangel · Fristsetzung · Rücktritt']],['Verwaltungsakt und Anhörung','C1',['Introduction|قانونی بودن شکلی شامل صلاحیت، تشریفات و شکل است.|Zuständigkeit, Verfahren und Form.','Vocabulary|Verwaltungsakt، Anhörung، Begründung، Heilung|Die Anhörung ist erforderlich.','Pronunciation|عبارت رسمی را تکرار کنید.|Der Verwaltungsakt ist formell rechtmäßig.','Grammar|Passiv در متن اداری.|Der Betroffene wird angehört.','Reading|مجوز بدون استماع رد می‌شود.|Ist das Verfahren ordnungsgemäß?','Listening|ساختار بررسی را بشنوید.|Zunächst ist die Zuständigkeit zu prüfen.','Speaking|نقص تشریفات را توضیح دهید.|Die Anhörung ist unterblieben.','Writing|نتیجه محتاطانه بنویسید.|Es bestehen Zweifel an der Rechtmäßigkeit.','Case Study|صلاحیت، استماع، شکل، جبران.|Zuständigkeit – Anhörung – Heilung','Quiz|Anhörung کجا بررسی می‌شود؟|Verfahren','Summary|نقص تشریفات ممکن است قابل جبران باشد.|Der Fehler könnte heilbar sein.','Review|واژگان اداری مرور می‌شوند.|Anhörung · Begründung · Heilung']]];LES.forEach(x=>x[2]=x[2].map(y=>y.split('|')));const DECK=[['der Anspruch','حق مطالبه','K hat einen Anspruch.'],['das Angebot','ایجاب','K gibt ein Angebot ab.'],['die Annahme','قبول','V nimmt das Angebot an.'],['der Sachmangel','عیب مادی','Die Sache ist mangelhaft.'],['die Nacherfüllung','اجرای اصلاحی','Der Käufer verlangt Nacherfüllung.'],['die Fristsetzung','تعیین مهلت','Eine Frist wird gesetzt.'],['der Verwaltungsakt','تصمیم اداری','Der Bescheid ist ein Verwaltungsakt.'],['die Anhörung','استماع','Die Anhörung ist unterblieben.']];const VV=['home','path','lesson','review','skills','case','writing','stats'],NN={home:['⌂','خانه'],path:['⌁','مسیر'],lesson:['▤','درس'],review:['⟳','مرور'],skills:['◫','مهارت'],case:['⚖','پرونده'],writing:['✎','نگارش'],stats:['◔','آمار']};function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open(D,1);r.onupgradeneeded=()=>r.result.createObjectStore(ST);r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>no(r.error)})}function get(){return new Promise(ok=>{let r=db.transaction(ST).objectStore(ST).get('main');r.onsuccess=()=>ok(r.result)})}function put(){return new Promise(ok=>{let t=db.transaction(ST,'readwrite');t.objectStore(ST).put(S,'main');t.oncomplete=ok})}async function save(ev){if(ev)S.history.push({ev,time:Date.now()});await put()}function build(){nav.innerHTML=VV.map(v=>`<button data-v="${v}"><b>${NN[v][0]}</b>${NN[v][1]}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.v))}function go(v){S.view=v;save();document.querySelectorAll('.v').forEach(x=>x.classList.toggle('a',x.id===v));nav.querySelectorAll('button').forEach(x=>x.classList.toggle('a',x.dataset.v===v));render(v)}function speak(t,r=.9){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=r;speechSynthesis.speak(u)}function mastery(){return Math.min(100,Math.round((S.done.length/36*.45+Object.keys(S.cards).length/8*.25+Object.keys(S.skills).length/4*.15+((S.caseText.length>100?1:0)+(S.writing.length>100?1:0))/2*.15)*100))}function due(i){let c=S.cards[i];return !c||!c.next||c.next<=Date.now()}async function rate(i,q){let p=S.cards[i]||{n:0,e:2.5,d:0},d=q===0?0:p.n?Math.round(p.d*(q===2?p.e:1.8)):q===2?4:1;S.cards[i]={n:p.n+1,e:Math.max(1.3,p.e+(q===0?-.2:q===2?.1:0)),d,next:Date.now()+d*86400000};S.minutes++;await save('review');render('review')}function render(v){let e=document.getElementById(v);if(v==='home')e.innerHTML=`<div class="hero"><h2>موتور آموزشی مرکزی فعال است</h2><p>۳ درس ۱۲مرحله‌ای، مسیر B2 تا C1، SRS، چهار مهارت، پرونده، نگارش و IndexedDB.</p><button class="btn" onclick="go('path')">شروع مسیر</button></div><div class="g"><div class="card"><h3>تسلط</h3><div class="metric">${mastery()}٪</div><div class="bar"><span style="width:${mastery()}%"></span></div></div><div class="card"><h3>مرور امروز</h3><div class="metric">${DECK.filter((_,i)=>due(i)).length}</div></div><div class="card"><h3>زمان</h3><div class="metric">${S.minutes} دقیقه</div></div></div>`;if(v==='path')e.innerHTML=`<div class="panel"><h3>مسیر تطبیقی</h3>${LES.map((l,i)=>{let n=[...Array(12).keys()].filter(j=>S.done.includes(i+'-'+j)).length;return `<div class="box"><b>${i+1}. ${l[0]}</b><span class="pill">${l[1]}</span><div class="bar"><span style="width:${n/12*100}%"></span></div><small>${n}/12 مرحله</small><br><button class="btn s" onclick="S.lesson=${i};S.step=${Math.min(n,11)};save();go('lesson')">باز کردن</button></div>`}).join('')}</div>`;if(v==='lesson'){let l=LES[S.lesson],x=l[2][S.step],k=S.lesson+'-'+S.step;e.innerHTML=`<div class="panel"><span class="pill">${l[1]}</span><span class="pill">${S.step+1}/12</span><h3>${l[0]} — ${x[0]}</h3><p>${x[1]}</p><div class="box de">${x[2]}</div>${['Pronunciation','Listening','Speaking'].includes(x[0])?`<button class="btn" onclick="speak(${JSON.stringify(x[2])},.75)">آهسته</button><button class="btn" onclick="speak(${JSON.stringify(x[2])},1)">طبیعی</button>`:''}<button class="btn s" onclick="S.step=Math.max(0,S.step-1);save();render('lesson')">قبلی</button><button class="btn ok" onclick="doneStep('${k}')">${S.done.includes(k)?'تکمیل شده':'تکمیل و ادامه'}</button></div>`}if(v==='review'){let i=DECK.findIndex((_,i)=>due(i));if(i<0)e.innerHTML='<div class="panel"><h3>مرور امروز تمام شد</h3></div>';else{let c=DECK[i];e.innerHTML=`<div class="panel"><h3>مرور فاصله‌دار</h3><div class="box" style="text-align:center"><h2 class="de">${c[0]}</h2><p>${c[1]}</p><div class="de">${c[2]}</div><button class="btn s" onclick="speak('${c[0]}',.75)">تلفظ</button><button class="btn s" onclick="speak('${c[2]}')">جمله</button></div><div class="rating"><button class="btn bad" onclick="rate(${i},0)">دوباره</button><button class="btn w" onclick="rate(${i},1)">متوسط</button><button class="btn ok" onclick="rate(${i},2)">آسان</button></div></div>`}}if(v==='skills'){let a=[['Lesen','استخراج مسئله و مبنا از متن'],['Hören','شنیدن و بازنویسی جمله حقوقی'],['Schreiben','نوشتن پاراگراف ODSE'],['Sprechen','ارائه ۶۰ ثانیه‌ای نتیجه']];e.innerHTML=`<div class="g">${a.map(x=>`<div class="card"><h3>${x[0]}</h3><p>${x[1]}</p>${x[0]==='Hören'?`<button class="btn" onclick="speak('Ein Kaufvertrag kommt durch Angebot und Annahme zustande.',.8)">پخش</button>`:''}${x[0]==='Sprechen'?`<button class="btn" onclick="rec()">تشخیص گفتار</button><div id="sp" class="fb"></div>`:''}<button class="btn ${S.skills[x[0]]?'ok':'s'}" onclick="skill('${x[0]}')">${S.skills[x[0]]?'ثبت شده':'ثبت انجام'}</button></div>`).join('')}</div>`}if(v==='case')e.innerHTML=`<div class="panel"><h3>Case Engine</h3><div class="box de">K bestellt bei V einen Laptop. V bestätigt die Bestellung, liefert aber nicht.</div><p>Kann K Lieferung aus § 433 Abs. 1 BGB verlangen?</p><textarea oninput="S.caseText=this.value;save()">${S.caseText}</textarea><button class="btn" onclick="caseCheck()">ارزیابی</button><div id="cf"></div></div>`;if(v==='writing')e.innerHTML=`<div class="panel"><h3>Writing Engine</h3><select><option>Falllösung</option><option>Seminararbeit</option><option>Magisterarbeit</option><option>E-Mail an Professor</option></select><textarea oninput="S.writing=this.value;save()">${S.writing}</textarea><button class="btn" onclick="writeCheck()">تحلیل</button><div id="wf"></div></div>`;if(v==='stats')e.innerHTML=`<div class="g"><div class="card"><h3>مراحل درس</h3><div class="metric">${S.done.length}/36</div></div><div class="card"><h3>کارت‌ها</h3><div class="metric">${Object.keys(S.cards).length}/8</div></div><div class="card"><h3>مهارت‌ها</h3><div class="metric">${Object.keys(S.skills).length}/4</div></div></div><div class="panel" style="margin-top:12px"><button class="btn s" onclick="restore.click()">بازیابی JSON</button></div>`}async function doneStep(k){if(!S.done.includes(k))S.done.push(k);S.minutes+=5;S.step=Math.min(11,S.step+1);await save('lesson');render('lesson')}async function skill(k){S.skills[k]=!S.skills[k];S.minutes+=S.skills[k]?5:-5;await save('skill');render('skills')}function caseCheck(){let t=S.caseText.toLowerCase(),r=[/könnte|zu prüfen/,/433|bgb/,/angebot|annahme/,/damit|somit/,/im ergebnis|folglich/],n=r.filter(x=>x.test(t)).length;cf.innerHTML=`<div class="fb">${n}/5 عنصر ساختاری یافت شد.</div>`;save('case')}function writeCheck(){let t=S.writing,a=[t.trim().split(/\s+/).length>=60?'طول مناسب':'متن کوتاه است',/daher|folglich|jedoch|zunächst/i.test(t)?'رابط استدلالی دارد':'رابط کم است',/ich finde|cool|quatsch/i.test(t)?'عبارت محاوره‌ای دارد':'لحن رسمی است',/§|rechtsprechung|literatur|norm/i.test(t)?'نشانه حقوقی دارد':'استناد حقوقی کم است'];wf.innerHTML='<div class="fb">'+a.map(x=>'• '+x).join('<br>')+'</div>';save('writing')}function rec(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){sp.textContent='مرورگر پشتیبانی نمی‌کند';return}let r=new R();r.lang='de-DE';r.onresult=e=>{sp.innerHTML='<div class="de">'+e.results[0][0].transcript+'</div>';save('speaking')};r.start()}function backup(){let b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='lgmk-v7.5-backup.json';a.click()}restore.onchange=async e=>{try{S={...S,...JSON.parse(await e.target.files[0].text())};await save('restore');go('home')}catch{alert('فایل نامعتبر')}};let dp;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;install.hidden=false});install.onclick=async()=>{if(dp){dp.prompt();await dp.userChoice;install.hidden=true}};if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js');openDB().then(get).then(x=>{if(x)S={...S,...x};else{let old=localStorage.getItem('lgmk-v6-state');if(old)try{S={...S,...JSON.parse(old)}catch{};put()}build();go(S.view)});</script></body></html>
