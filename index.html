<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102a43"><meta name="description" content="Legal German MasterKit v2.0 برای LL.M. oec. Privates und Öffentliches Wirtschaftsrecht دانشگاه ینا"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>Legal German MasterKit v2.0</title><style>:root{--bg:#f3f6fa;--card:#fff;--ink:#102a43;--muted:#627d98;--line:#d9e2ec;--brand:#0b7285;--navy:#102a43;--ok:#2b8a3e;--shadow:0 10px 30px rgba(16,42,67,.09)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif;line-height:1.75;padding-bottom:76px}button,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--navy),var(--brand));color:#fff;padding:13px 16px;display:flex;justify-content:space-between;align-items:center}.top h1{font-size:1.05rem;margin:0}.top small{display:block;color:#d9e2ec}.top button{min-height:44px;border:1px solid #9fb3c8;background:transparent;color:#fff;border-radius:12px;padding:0 12px}.wrap{max-width:1100px;margin:auto;padding:14px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.hero{padding:22px;background:linear-gradient(135deg,#102a43,#0b7285);color:#fff}.hero h2{margin:0 0 8px}.hero p{color:#d9e2ec}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.card{padding:16px}.card h3{margin:0 0 6px}.muted{color:var(--muted)}.view{display:none}.view.active{display:block}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.input,.select,textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}.toolbar .input{flex:1;min-width:190px}.toolbar .select{width:auto}.btn{min-height:44px;border:0;border-radius:12px;background:var(--brand);color:#fff;padding:0 15px;cursor:pointer}.btn.secondary{background:#e7eef5;color:var(--ink)}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:#eef3f8;border-radius:999px;padding:4px 8px;font-size:.78rem}.course{border-right:5px solid var(--brand)}.phrase{display:grid;grid-template-columns:1.2fr 1fr auto;gap:10px;align-items:center;margin-bottom:10px}.de{direction:ltr;text-align:left;font-weight:700}.fav{width:44px;height:44px;border:0;border-radius:10px;background:#eef3f8}.fav.on{color:#d9480f;background:#fff4e6}.acc{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}.acc summary{padding:14px;font-weight:700;cursor:pointer}.acc>div{padding:0 14px 14px}.example{direction:ltr;text-align:left;background:#eef3f8;border-radius:10px;padding:10px}.step{border-right:4px solid var(--brand);background:#eef3f8;border-radius:10px;padding:10px;margin:7px 0}.writing{display:grid;grid-template-columns:1.3fr .7fr;gap:12px}.writing textarea{min-height:270px;direction:ltr;text-align:left}.feedback div{background:#eef3f8;border-radius:10px;padding:9px;margin-bottom:7px}.option{display:block;border:1px solid var(--line);border-radius:10px;padding:9px;margin:6px 0}.score{font-size:2rem;font-weight:800;color:var(--brand)}.bar{height:10px;background:#e7eef5;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:var(--brand)}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:5px 4px calc(5px + env(safe-area-inset-bottom))}.nav{border:0;background:transparent;min-height:56px;font-size:.69rem;color:var(--muted)}.nav b{display:block;font-size:1.1rem}.nav.active{color:var(--brand);font-weight:700}@media(max-width:800px){.grid{grid-template-columns:1fr}.writing{grid-template-columns:1fr}.phrase{grid-template-columns:1fr auto}.phrase .fa{grid-column:1/-1}.toolbar .select{width:100%}}@media(min-width:801px){body{padding-bottom:0}.bottom{position:sticky;top:72px;bottom:auto;max-width:1100px;margin:auto;border:1px solid var(--line);border-radius:14px;grid-template-columns:repeat(8,1fr)}.nav{font-size:.78rem}}</style></head><body><header class="top"><div><h1>Legal German MasterKit v2.0</h1><small>LL.M. oec. · Friedrich-Schiller-Universität Jena</small></div><button id="install" hidden>نصب</button></header><nav class="bottom" id="nav"></nav><main class="wrap"><section id="home" class="view active"></section><section id="courses" class="view"></section><section id="phrases" class="view"></section><section id="grammar" class="view"></section><section id="cases" class="view"></section><section id="writing" class="view"></section><section id="quiz" class="view"></section><section id="progress" class="view"></section></main><script>const DATA={courses:[['Privates Wirtschaftsrecht','حقوق اقتصادی خصوصی',['BGB Allgemeiner Teil','Schuldrecht','Vertragsrecht','Handelsrecht','Gesellschaftsrecht','Arbeitsrecht','Insolvenzrecht']],['Öffentliches Wirtschaftsrecht','حقوق اقتصادی عمومی',['Staatsrecht','Verwaltungsrecht','Wirtschaftsverwaltungsrecht','Vergaberecht','Regulierungsrecht','Umweltrecht']],['Europäisches Wirtschaftsrecht','حقوق اقتصادی اروپا',['EU-Binnenmarkt','Grundfreiheiten','Kartellrecht','Beihilfenrecht','Internationales Wirtschaftsrecht']],['Wirtschaftswissenschaftliche Grundlagen','مبانی اقتصادی',['Mikroökonomie','Makroökonomie','Unternehmensökonomie','Wettbewerb und Märkte']],['Wissenschaftliches Arbeiten','کار علمی',['Literaturrecherche','Juristische Zitierweise','Seminararbeit','Präsentation','Magisterarbeit']],['Praxis und Prüfung','کار عملی و ارزیابی',['Seminare','Fallbearbeitung','Achtwöchiges Praktikum','Mündliche Diskussion','Prüfungsvorbereitung']]],phrases:[['Fragestellung','Es stellt sich die Frage, ob …','این پرسش مطرح می‌شود که آیا …'],['Fragestellung','Zu prüfen ist, ob …','باید بررسی شود که آیا …'],['Gesetz','Gemäß § … ist …','مطابق ماده …، …'],['Gesetz','Nach dem Wortlaut der Vorschrift …','بر اساس عبارت صریح مقرره …'],['Definition','Unter … versteht man …','منظور از … عبارت است از …'],['Definition','Voraussetzung hierfür ist, dass …','شرط این امر آن است که …'],['Subsumtion','Im vorliegenden Fall …','در پرونده حاضر …'],['Subsumtion','Dies setzt voraus, dass …','این امر مستلزم آن است که …'],['Subsumtion','Der Sachverhalt erfüllt das Merkmal, weil …','وقایع، این معیار را برآورده می‌کند زیرا …'],['Literatur','Nach herrschender Meinung …','بر اساس نظر غالب …'],['Literatur','Nach überwiegender Auffassung in der Literatur …','بر اساس دیدگاه غالب در ادبیات حقوقی …'],['Literatur','Die Gegenauffassung überzeugt nicht, weil …','دیدگاه مخالف قانع‌کننده نیست زیرا …'],['Urteil','Das Gericht führt aus, dass …','دادگاه بیان می‌کند که …'],['Urteil','Aus der Rechtsprechung ergibt sich, dass …','از رویه قضایی نتیجه می‌شود که …'],['Ergebnis','Daher ist davon auszugehen, dass …','بنابراین باید چنین فرض کرد که …'],['Ergebnis','Im Ergebnis ist festzuhalten, dass …','در نتیجه باید بیان کرد که …'],['Abwägung','Für diese Auffassung spricht …','در تأیید این دیدگاه می‌توان گفت …'],['Abwägung','Dagegen spricht jedoch …','با این حال، در مخالفت با آن می‌توان گفت …'],['Seminar','Im Folgenden wird untersucht, ob …','در ادامه بررسی می‌شود که آیا …'],['Seminar','Die Arbeit gliedert sich in …','این پژوهش به بخش‌های زیر تقسیم می‌شود …']],grammar:[['Passiv','مجهول حقوقی','فاعل اهمیت ندارد و عمل یا الزام در مرکز است.','Der Antrag wird geprüft.'],['Nominalstil','سبک اسمی','افعال به اسم تبدیل می‌شوند تا متن رسمی‌تر شود.','die Prüfung des Antrags'],['Konjunktiv I','نقل غیرمستقیم','برای گزارش نظر نویسنده یا دادگاه بدون پذیرش آن.','Das Gericht erkläre, die Norm sei anwendbar.'],['Modalverben','افعال وجهی','muss برای الزام، darf برای اجازه و kann برای امکان.','Die Behörde muss entscheiden.'],['Genitiv','ساختار اضافه','در نام مقررات و روابط حقوقی فراوان است.','die Wirksamkeit des Vertrags'],['Relativsatz','جمله موصولی','برای تعریف دقیق اشخاص، اشیا یا مقررات.','Die Norm, die hier anwendbar ist, …']],cases:[{t:'Kaufvertrag',a:'Vertragsrecht',f:'K bestellt bei V einen Laptop. V bestätigt die Bestellung, liefert jedoch nicht.',q:'Kann K Lieferung verlangen?',s:['Anspruchsgrundlage: § 433 Abs. 1 BGB','Wirksamer Kaufvertrag','Fälligkeit und keine Einwendungen'],m:'K könnte gegen V einen Anspruch auf Übergabe und Übereignung aus § 433 Abs. 1 Satz 1 BGB haben.'},{t:'Gewerbeerlaubnis',a:'Öffentliches Wirtschaftsrecht',f:'A beantragt eine gewerberechtliche Erlaubnis. Die Behörde lehnt ohne Anhörung ab.',q:'Ist der Bescheid formell rechtmäßig?',s:['Zuständigkeit','Verfahren und Anhörung','Form und Begründung'],m:'Die formelle Rechtmäßigkeit ist zweifelhaft, wenn eine erforderliche Anhörung unterblieben ist.'}],quiz:[['کدام عبارت برای طرح مسئله مناسب است؟',['Es stellt sich die Frage, ob …','Ich finde das cool.','Vielleicht irgendwie.'],0],['ساختار Gutachtenstil کدام است؟',['Obersatz–Definition–Subsumtion–Ergebnis','نتیجه–مقدمه–منبع','فقط تعریف'],0],['کدام عبارت نقل نظر غالب است؟',['Nach herrschender Meinung …','Meiner Meinung nach …','Das ist super.'],0],['Magisterarbeit چیست؟',['کار نهایی علمی دوره','آزمون زبان','کارآموزی'],0],['Passiv در متن حقوقی چه کاربردی دارد؟',['تمرکز بر عمل یا الزام','محاوره‌ای کردن متن','کوتاه‌کردن منبع'],0]]};const KEY='lgmk-v2-state';let state=JSON.parse(localStorage.getItem(KEY)||'{}');state={view:'home',done:[],fav:[],answers:{},writing:'',quiz:null,...state};const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const views=['home','courses','phrases','grammar','cases','writing','quiz','progress'];const names={home:['⌂','خانه'],courses:['§','دروس'],phrases:['✎','جملات'],grammar:['A','گرامر'],cases:['⚖','پرونده'],writing:['▤','نگارش'],quiz:['✓','آزمون'],progress:['◔','پیشرفت']};function go(v){state.view=v;save();document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===v));document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.v===v));render(v)}function nav(){navEl.innerHTML=views.map(v=>`<button class="nav ${v===state.view?'active':''}" data-v="${v}"><b>${names[v][0]}</b>${names[v][1]}</button>`).join('');document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>go(b.dataset.v))}function progress(){return Math.min(100,Math.round((new Set(state.done).size+state.fav.length+Object.keys(state.answers).length+(state.quiz?1:0))/20*100))}function render(v){const el=document.getElementById(v);if(v==='home')el.innerHTML=`<div class="hero"><h2>آمادگی واقعی برای تحصیل حقوق اقتصادی به زبان آلمانی</h2><p>چهار مهارت، دروس رشته، جمله‌بندی حقوقی، گرامر، پرونده، Writing Lab و ارزیابی در یک PWA موبایل‌محور.</p><button class="btn" onclick="go('courses')">شروع برنامه</button></div><div class="grid"><div class="card"><h3>پیشرفت</h3><div class="score">${progress()}٪</div></div><div class="card"><h3>جملات</h3><div class="score">${DATA.phrases.length}</div></div><div class="card"><h3>ماژول‌ها</h3><div class="score">${DATA.courses.length}</div></div></div>`;if(v==='courses')el.innerHTML=`<h2>منوی دروس LL.M. oec.</h2><p class="muted">ساختار آموزشی هدفمند؛ فهرست دقیق ارائه‌های هر ترم باید با Friedolin و اطلاعیه استاد تطبیق داده شود.</p><div class="grid">${DATA.courses.map((c,i)=>`<article class="card course"><h3 dir="ltr">${c[0]}</h3><p>${c[1]}</p><div class="chips">${c[2].map(x=>`<span class="chip">${x}</span>`).join('')}</div><button class="btn secondary" onclick="toggleDone('course${i}')">${state.done.includes('course'+i)?'تکمیل شد':'ثبت مطالعه'}</button></article>`).join('')}</div>`;if(v==='phrases')el.innerHTML=`<h2>بانک جمله‌های حقوقی</h2><div class="toolbar"><input id="search" class="input" placeholder="جست‌وجوی آلمانی یا فارسی"><select id="cat" class="select"><option value="">همه دسته‌ها</option>${[...new Set(DATA.phrases.map(x=>x[0]))].map(x=>`<option>${x}</option>`).join('')}</select></div><div id="plist"></div>`,phraseDraw();if(v==='grammar')el.innerHTML=`<h2>Legal Grammar</h2>${DATA.grammar.map((g,i)=>`<details class="acc"><summary>${g[0]} — ${g[1]}</summary><div><p>${g[2]}</p><div class="example">${g[3]}</div><button class="btn secondary" onclick="toggleDone('grammar${i}')">${state.done.includes('grammar'+i)?'تکمیل شد':'ثبت تکمیل'}</button></div></details>`).join('')}`;if(v==='cases')el.innerHTML=`<h2>تحلیل مرحله‌ای پرونده</h2>${DATA.cases.map((c,i)=>`<details class="acc"><summary>${c.t} · ${c.a}</summary><div><h3>Sachverhalt</h3><p dir="ltr">${c.f}</p><h3>Rechtsfrage</h3><p dir="ltr">${c.q}</p>${c.s.map((x,j)=>`<div class="step"><b>${j+1}</b> ${x}</div>`).join('')}<textarea id="case${i}" placeholder="پاسخ آلمانی شما">${state.answers[i]||''}</textarea><button class="btn" onclick="saveCase(${i})">ذخیره پاسخ</button><details><summary>پاسخ نمونه</summary><p class="example">${c.m}</p></details></div></details>`).join('')}`;if(v==='writing')el.innerHTML=`<h2>Writing Lab</h2><div class="writing"><div class="card"><textarea id="wtext" placeholder="متن آلمانی خود را بنویسید">${state.writing}</textarea><div class="toolbar"><button class="btn" onclick="analyze()">تحلیل متن</button><button class="btn secondary" onclick="saveWriting()">ذخیره</button></div></div><aside class="card"><h3>بازخورد</h3><div id="feedback" class="feedback"><p class="muted">تحلیل قاعده‌محور است و جایگزین بازبینی علمی نیست.</p></div></aside></div>`;if(v==='quiz')el.innerHTML=`<h2>آزمون</h2><form id="qform">${DATA.quiz.map((q,i)=>`<div class="card"><h3>${i+1}. ${q[0]}</h3>${q[1].map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}">${o}</label>`).join('')}</div>`).join('')}<button class="btn">محاسبه امتیاز</button></form><div id="qresult"></div>`,qform.onsubmit=e=>{e.preventDefault();let sc=0;DATA.quiz.forEach((q,i)=>{const a=document.querySelector(`input[name=q${i}]:checked`);if(a&&+a.value===q[2])sc++});state.quiz=sc;save();qresult.innerHTML=`<div class="card"><div class="score">${sc} از ${DATA.quiz.length}</div></div>`};if(v==='progress')el.innerHTML=`<h2>داشبورد پیشرفت</h2><div class="grid"><div class="card"><h3>پیشرفت کل</h3><div class="score">${progress()}٪</div><div class="bar"><span style="width:${progress()}%"></span></div></div><div class="card"><h3>موارد تکمیل‌شده</h3><div class="score">${new Set(state.done).size}</div></div><div class="card"><h3>جملات منتخب</h3><div class="score">${state.fav.length}</div></div><div class="card"><h3>پاسخ پرونده‌ها</h3><div class="score">${Object.keys(state.answers).length}</div></div><div class="card"><h3>آخرین آزمون</h3><div class="score">${state.quiz===null?'—':state.quiz+'/'+DATA.quiz.length}</div></div><div class="card"><button class="btn secondary" onclick="exportData()">خروجی پشتیبان JSON</button></div></div>`}function phraseDraw(){const draw=()=>{const q=(search.value||'').toLowerCase(),c=cat.value;plist.innerHTML=DATA.phrases.filter(x=>(!c||x[0]===c)&&(!q||(x.join(' ').toLowerCase().includes(q)))).map((x,i)=>`<article class="card phrase"><div class="de">${x[1]}<small class="muted">${x[0]}</small></div><div class="fa">${x[2]}</div><button class="fav ${state.fav.includes(i)?'on':''}" onclick="toggleFav(${i})">★</button></article>`).join('')};search.oninput=cat.onchange=draw;draw()}function toggleDone(id){state.done=state.done.includes(id)?state.done.filter(x=>x!==id):[...state.done,id];save();render(state.view)}function toggleFav(i){state.fav=state.fav.includes(i)?state.fav.filter(x=>x!==i):[...state.fav,i];save();phraseDraw()}function saveCase(i){state.answers[i]=document.getElementById('case'+i).value;save();alert('پاسخ ذخیره شد')}function saveWriting(){state.writing=wtext.value;save();alert('متن ذخیره شد')}function analyze(){const t=wtext.value.trim(),f=[];if(t.length<80)f.push('متن برای یک بند تحلیلی کوتاه است.');if(/\b(ich denke|cool|doof|irgendwie)\b/i.test(t))f.push('عبارت محاوره‌ای شناسایی شد؛ لحن رسمی‌تر انتخاب کنید.');if(!/\b(gemäß|nach|daher|folglich|allerdings|im Ergebnis)\b/i.test(t))f.push('یک نشانگر استدلالی یا استنادی اضافه کنید.');if(!/[.!?]$/.test(t))f.push('نشانه پایان جمله را بررسی کنید.');if(!f.length)f.push('هشدار قاعده‌محور آشکاری یافت نشد؛ صحت حقوقی و منابع را انسانی کنترل کنید.');feedback.innerHTML=f.map(x=>`<div>${x}</div>`).join('');state.writing=t;save()}function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='legal-german-masterkit-backup.json';a.click()}nav();go(state.view);let promptEvent;addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e;install.hidden=false});install.onclick=()=>promptEvent&&promptEvent.prompt();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));</script></body></html>
