<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#103b4a"><meta name="description" content="Legal German MasterKit v2.1 برای LL.M. oec. دانشگاه ینا"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>Legal German MasterKit v2.1</title><style>:root{--bg:#f3f7f9;--card:#fff;--ink:#17324d;--muted:#637789;--line:#dbe5ea;--brand:#0b7285;--navy:#103b4a;--soft:#eaf3f5;--ok:#2b8a3e;--warn:#a66b00;--shadow:0 10px 28px rgba(23,50,77,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif;line-height:1.75;padding-bottom:78px}button,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:40;background:linear-gradient(135deg,var(--navy),var(--brand));color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 14px #0002}.top h1{font-size:1rem;margin:0}.top small{display:block;color:#d9edf0;font-size:.72rem}.top button{min-height:44px;border:1px solid #ffffff80;background:transparent;color:#fff;border-radius:12px;padding:0 12px}.wrap{max-width:1120px;margin:auto;padding:14px}.view{display:none}.view.active{display:block}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.hero{padding:22px;background:linear-gradient(135deg,#12344d,#0b7285);color:#fff}.hero h2{margin:0 0 7px;font-size:clamp(1.25rem,5vw,2rem)}.hero p{color:#d9edf0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.card{padding:15px}.card h3{margin:0 0 6px}.metric{font-size:1.8rem;font-weight:800;color:var(--brand)}.muted{color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.input,.select,textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;color:var(--ink)}.toolbar .input{flex:1;min-width:190px}.toolbar .select{width:auto}.btn{min-height:44px;border:0;border-radius:12px;background:var(--brand);color:#fff;padding:0 15px;cursor:pointer}.btn.secondary{background:var(--soft);color:var(--ink)}.course{border-right:5px solid var(--brand)}.chip{display:inline-block;background:var(--soft);border-radius:999px;padding:3px 8px;font-size:.76rem;margin:2px}.skill{display:flex;justify-content:space-between;align-items:center;gap:10px}.bar{height:10px;background:#e5edf1;border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;background:var(--brand)}.phrase{display:grid;grid-template-columns:1.2fr 1fr auto;gap:9px;align-items:center;margin-bottom:9px}.de{direction:ltr;text-align:left;font-weight:700}.fav{width:44px;height:44px;border:0;border-radius:10px;background:var(--soft)}.fav.on{color:#d9480f;background:#fff4e6}.acc{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}.acc summary{padding:14px;font-weight:700;cursor:pointer}.acc>div{padding:0 14px 14px}.example,.step{background:var(--soft);border-radius:10px;padding:10px;margin:7px 0}.example{direction:ltr;text-align:left}.writing{display:grid;grid-template-columns:1.25fr .75fr;gap:12px}.writing textarea{min-height:260px;direction:ltr;text-align:left}.feedback div{background:var(--soft);border-radius:10px;padding:9px;margin-bottom:7px}.option{display:block;border:1px solid var(--line);border-radius:10px;padding:9px;margin:6px 0}.notice{border-right:4px solid var(--warn);background:#fff8e1;border-radius:10px;padding:10px;margin-top:12px}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:50;display:grid;grid-template-columns:repeat(5,1fr);background:#fffffffa;border-top:1px solid var(--line);padding:5px 4px calc(5px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px #0001}.nav{border:0;background:transparent;min-height:56px;font-size:.68rem;color:var(--muted)}.nav b{display:block;font-size:1.05rem}.nav.active{color:var(--brand);font-weight:700}@media(max-width:800px){.grid{grid-template-columns:1fr}.writing{grid-template-columns:1fr}.phrase{grid-template-columns:1fr auto}.phrase .fa{grid-column:1/-1}.toolbar .select{width:100%}}@media(min-width:801px){body{padding-bottom:0}.bottom{position:sticky;top:69px;bottom:auto;max-width:1120px;margin:auto;border:1px solid var(--line);border-radius:14px;grid-template-columns:repeat(9,1fr)}}</style></head><body><header class="top"><div><h1>Legal German MasterKit v2.1</h1><small>LL.M. oec. · Friedrich-Schiller-Universität Jena</small></div><button id="install" hidden>نصب</button></header><nav class="bottom" id="nav"></nav><main class="wrap"><section id="home" class="view active"></section><section id="courses" class="view"></section><section id="skills" class="view"></section><section id="phrases" class="view"></section><section id="grammar" class="view"></section><section id="cases" class="view"></section><section id="writing" class="view"></section><section id="quiz" class="view"></section><section id="progress" class="view"></section></main><script>const COURSES=[['Privates Wirtschaftsrecht','BGB AT|Schuldrecht|Vertragsrecht|Handelsrecht|Gesellschaftsrecht|Arbeitsrecht|Insolvenzrecht'],['Öffentliches Wirtschaftsrecht','Staatsrecht|Grundrechte|Verwaltungsrecht|Wirtschaftsverwaltungsrecht|Vergaberecht|Regulierungsrecht'],['Europäisches Wirtschaftsrecht','Binnenmarkt|Grundfreiheiten|Kartellrecht|Beihilfenrecht|Internationales Wirtschaftsrecht'],['Wirtschaftswissenschaften','Mikroökonomie|Makroökonomie|Unternehmensökonomie|Wettbewerb und Märkte'],['Wissenschaftliches Arbeiten','Literaturrecherche|Zitierweise|Seminararbeit|Präsentation|Magisterarbeit'],['Praxis und Prüfung','Zwei Seminare|Achtwöchiges Praktikum|Fallbearbeitung|Mündliche Diskussion']];const PH=[['Fragestellung','Es stellt sich die Frage, ob …','این پرسش مطرح می‌شود که آیا …'],['Fragestellung','Zu prüfen ist, ob …','باید بررسی شود که آیا …'],['Fragestellung','Fragli Anders hingegen …','اما برخلاف آن …'],['Citation','Zur Vertiefung siehe …','برای مطالعه بیشتر بنگرید به …'],['Presentation','Ich möchte zunächst die Ausgangslage skizzieren.','ابتدا وضعیت اولیه را ترسیم می‌کنم.'],['Presentation','Anschließend gehe ich auf drei zentrale Punkte ein.','سپس به سه نکته اصلی می‌پردازم.'],['Presentation','Damit komme ich zum Ergebnis.','با این مقدمه به نتیجه می‌رسم.'],['Email','Ich möchte mich nach … erkundigen.','مایلم درباره … پرس‌وجو کنم.'],['Email','Anbei übersende ich Ihnen …','پیوست، … را ارسال می‌کنم.'],['Discussion','Ich stimme dieser Auffassung nur teilweise zu.','فقط تا حدی با این دیدگاه موافقم.'],['Discussion','Meines Erachtens bleibt unberücksichtigt, dass …','به نظر من نادیده گرفته می‌شود که …'],['Economics','Aus ökonomischer Sicht ist zu berücksichtigen, dass …','از منظر اقتصادی باید در نظر گرفت که …'],['Economics','Die Regelung beeinflusst den Wettbewerb, indem …','این مقرره از طریق … بر رقابت اثر می‌گذارد'],['Economics','Die Maßnahme ist unter Effizienzgesichtspunkten zu bewerten.','اقدام باید از منظر کارایی ارزیابی شود']];const GR=[['Passiv','تمرکز بر عمل یا تصمیم','Der Antrag wird geprüft.'],['Nominalstil','سبک رسمی و فشرده','Nach Prüfung des Antrags …'],['Konjunktiv I','نقل غیرمستقیم','Das Gericht erkläre, die Norm sei anwendbar.'],['Konjunktiv II','فرض و احتیاط','Dies könnte gegen die Wirksamkeit sprechen.'],['Modalverben','الزام و اختیار','Die Behörde muss entscheiden.'],['Genitiv','روابط حقوقی','die Wirksamkeit des Vertrags'],['Relativsatz','تعریف دقیق','Die Norm, die hier gilt, …'],['Partizipialattribut','توضیح فشرده','die vom Gericht entwickelte Rechtsprechung'],['Funktionsverbgefüge','ترکیب رسمی','Die Vorschrift kommt zur Anwendung.'],['Konnektoren','رابطه منطقی','Zwar …, jedoch …'],['Konditionalsätze','شرط قانونی','Sofern die Voraussetzungen vorliegen …'],['Genitivketten','زنجیره اضافه','die Prüfung der Rechtmäßigkeit des Bescheids']];const CASES=[['Kaufvertrag','K bestellt einen Laptop. V bestätigt, liefert aber nicht.','Kann K Lieferung verlangen?',['§ 433 Abs. 1 BGB','Vertragsschluss','Fälligkeit','Einwendungen'],'K könnte einen Anspruch auf Lieferung aus § 433 Abs. 1 BGB haben.'],['Anfechtung','V nennt versehentlich 1.000 statt 10.000 Euro und ficht unverzüglich an.','Bleibt der Vertrag wirksam?',['Vertragsschluss','Erklärungsirrtum','Frist','Nichtigkeit ex tunc'],'Der Vertrag ist zunächst geschlossen, kann aber rückwirkend nichtig werden.'],['Gewerbeerlaubnis','Die Behörde lehnt ohne Anhörung und Begründung ab.','Ist der Bescheid formell rechtmäßig?',['Zuständigkeit','Anhörung','Form','Heilung'],'Die formelle Rechtmäßigkeit ist wegen möglicher Verfahrensfehler zweifelhaft.'],['Vergabe','Ein EU-Bewerber wird allein wegen seines ausländischen Sitzes ausgeschlossen.','Ist der Ausschluss zulässig?',['Anwendungsbereich','Gleichbehandlung','Rechtfertigung','Verhältnismäßigkeit'],'Der Ausschluss spricht für eine unzulässige Diskriminierung.'],['Kartellrecht','Wettbewerber vereinbaren eine gemeinsame Preiserhöhung.','Verstoß gegen Art. 101 AEUV?',['Vereinbarung','Wettbewerbsbeschränkung','Zwischenstaatlichkeit','Freistellung'],'Eine horizontale Preisabsprache ist regelmäßig verboten.'],['Arbeitsrecht','S ist organisatorisch eingegliedert und weisungsgebunden, heißt aber freier Mitarbeiter.','Ist S Arbeitnehmer?',['Tatsächliche Durchführung','Weisungsbindung','Eingliederung','Gesamtwürdigung'],'Die tatsächliche Abhängigkeit spricht für Arbeitnehmereigenschaft.']];const QUIZ=[['طرح مسئله؟','Es stellt sich die Frage, ob …','Das ist cool.'],['Gutachtenstil؟','Obersatz–Definition–Subsumtion–Ergebnis','فقط نتیجه'],['نظر غالب؟','Nach herrschender Meinung …','Ich finde …'],['کار نهایی؟','Magisterarbeit','DSH'],['مدت کارآموزی؟','هشت هفته','دو هفته'],['الزام زبان؟','DSH-2 یا معادل','DSH-1'],['TestDaF معتبر؟','TDN4 در هر چهار بخش','4-4-4-3'],['نقل غیرمستقیم؟','Konjunktiv I','Imperativ'],['شرط حقوقی؟','sofern','trotzdem'],['نتیجه‌گیری؟','Im Ergebnis ist festzuhalten …','Hallo …'],['استدلال مخالف؟','Dagegen spricht jedoch …','Gemäß § …'],['Subsumtion؟','تطبیق وقایع با معیار حقوقی','فهرست منابع']];const K='lgmk-v21';let S=JSON.parse(localStorage.getItem(K)||'{}');S={view:'home',done:[],fav:[],answers:{},writing:'',quiz:null,skill:{Lesen:0,Hören:0,Schreiben:0,Sprechen:0},...S};const save=()=>localStorage.setItem(K,JSON.stringify(S));const V=['home','courses','skills','phrases','grammar','cases','writing','quiz','progress'],N={home:['⌂','خانه'],courses:['§','دروس'],skills:['4','مهارت'],phrases:['✎','جملات'],grammar:['A','گرامر'],cases:['⚖','پرونده'],writing:['▤','نگارش'],quiz:['✓','آزمون'],progress:['◔','پیشرفت']};function nav(){nav.innerHTML=V.map(v=>`<button class="nav ${v===S.view?'active':''}" data-v="${v}"><b>${N[v][0]}</b>${N[v][1]}</button>`).join('');document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>go(b.dataset.v))}function go(v){S.view=v;save();document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===v));document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.v===v));render(v);scrollTo(0,0)}function pct(){return Math.min(100,Math.round((S.done.length+S.fav.length/4+Object.keys(S.answers).length+(S.quiz?2:0)+Object.values(S.skill).reduce((a,b)=>a+b,0)/100)/25*100))}function render(v){let e=document.getElementById(v);if(v==='home')e.innerHTML=`<div class="hero"><h2>هسته دانشگاهی و چهارمهارته نسخه ۲.۱</h2><p>ساختار رسمی دوره، مسیر B2→C1، ${PH.length} قالب جمله، ${GR.length} درس گرامر، ${CASES.length} پرونده و ارزیابی تطبیقی.</p><button class="btn" onclick="go('skills')">شروع مسیر</button></div><div class="grid"><div class="card"><h3>پیشرفت</h3><div class="metric">${pct()}٪</div><div class="bar"><span style="width:${pct()}%"></span></div></div><div class="card"><h3>ساختار ثابت</h3><p>۳۶ SWS، دو سمینار، ۴ SWS اروپایی/بین‌المللی، کارآموزی ۸ هفته‌ای و Magisterarbeit.</p></div><div class="card"><h3>زبان ورود</h3><p>DSH-2 یا معادل؛ TestDaF حداقل TDN4 در هر چهار بخش.</p></div></div><div class="notice">دروس قابل اخذ هر ترم متغیرند؛ برنامه جاری دانشکده و Friedolin مرجع نهایی است.</div>`;if(v==='courses')e.innerHTML=`<h2>نقشه درسی واقعی</h2><div class="grid">${COURSES.map((c,i)=>`<article class="card course"><h3>${c[0]}</h3>${c[1].split('|').map(x=>`<span class="chip">${x}</span>`).join('')}<p><button class="btn secondary" onclick="done('c${i}')">${S.done.includes('c'+i)?'مطالعه شد':'ثبت مطالعه'}</button></p></article>`).join('')}</div>`;if(v==='skills'){let T={Lesen:'قانون، رأی و مقاله را بخوان و ساختار را استخراج کن.',Hören:'سخنرانی را گوش بده، یادداشت‌برداری و بازگویی کن.',Schreiben:'Obersatz، Subsumtion و خلاصه علمی بنویس.',Sprechen:'پرونده را ارائه کن و به اعتراض پاسخ بده.'};e.innerHTML=`<h2>چهار مهارت B2→C1</h2><div class="grid">${Object.keys(T).map(k=>`<article class="card"><div class="skill"><h3>${k}</h3><b>${S.skill[k]}٪</b></div><div class="bar"><span style="width:${S.skill[k]}%"></span></div><p>${T[k]}</p><button class="btn" onclick="skill('${k}')">ثبت یک تمرین +۲۵٪</button></article>`).join('')}</div>`}if(v==='phrases'){let cats=[...new Set(PH.map(x=>x[0]))];e.innerHTML=`<h2>بانک جمله‌های حقوقی</h2><div class="toolbar"><input id="pq" class="input" placeholder="جست‌وجوی فارسی یا آلمانی"><select id="pc" class="select"><option value="">همه دسته‌ها</option>${cats.map(x=>`<option>${x}</option>`).join('')}</select></div><div id="pl"></div>`;let draw=()=>pl.innerHTML=PH.map((p,i)=>({p,i})).filter(o=>(!pc.value||o.p[0]===pc.value)&&o.p.join(' ').toLowerCase().includes(pq.value.toLowerCase())).map(o=>`<article class="card phrase"><div><span class="chip">${o.p[0]}</span><div class="de">${o.p[1]}</div></div><div class="fa">${o.p[2]}</div><button class="fav ${S.fav.includes(o.i)?'on':''}" onclick="fav(${o.i})">★</button></article>`).join('')||'<p>نتیجه‌ای نیست.</p>';pq.oninput=pc.onchange=draw;draw()}if(v==='grammar')e.innerHTML=`<h2>Legal Grammar</h2>${GR.map((g,i)=>`<details class="acc"><summary>${i+1}. ${g[0]}</summary><div><p>${g[1]}</p><div class="example">${g[2]}</div><button class="btn secondary" onclick="done('g${i}')">${S.done.includes('g'+i)?'مطالعه شد':'ثبت مطالعه'}</button></div></details>`).join('')}`;if(v==='cases')e.innerHTML=`<h2>پرونده‌های مرحله‌ای</h2>${CASES.map((c,i)=>`<details class="acc"><summary>${c[0]}</summary><div><p class="de">${c[1]}</p><h3>${c[2]}</h3>${c[3].map((x,n)=>`<div class="step">${n+1}. ${x}</div>`).join('')}<textarea id="ca${i}" placeholder="Ihre Lösung …">${S.answers[i]||''}</textarea><p><button class="btn" onclick="saveCase(${i})">ذخیره پاسخ</button> <button class="btn secondary" onclick="m${i}.hidden=false">پاسخ نمونه</button></p><div id="m${i}" class="example" hidden>${c[4]}</div></div></details>`).join('')}`;if(v==='writing')e.innerHTML=`<h2>Writing Lab</h2><div class="writing"><div class="card"><select class="select"><option>Falllösung</option><option>Seminararbeit</option><option>Magisterarbeit</option><option>E-Mail</option></select><textarea id="wt" placeholder="Schreiben Sie Ihren Text …">${S.writing}</textarea><p><button class="btn" onclick="analyze()">تحلیل متن</button> <button class="btn secondary" onclick="S.writing=wt.value;save()">ذخیره</button></p></div><div class="card feedback" id="fb"><p class="muted">طول، لحن، پیوندهای استدلالی و نشانگرهای ساختار حقوقی بررسی می‌شوند.</p></div></div>`;if(v==='quiz')e.innerHTML=`<h2>ارزیابی جامع</h2><form id="qf">${QUIZ.map((q,i)=>`<article class="card"><h3>${i+1}. ${q[0]}</h3><label class="option"><input type="radio" name="q${i}" value="1"> ${q[1]}</label><label class="option"><input type="radio" name="q${i}" value="0"> ${q[2]}</label></article>`).join('')}<button class="btn">محاسبه امتیاز</button></form><div id="qr"></div>`;if(v==='quiz')qf.onsubmit=x=>{x.preventDefault();let z=QUIZ.reduce((a,q,i)=>a+(new FormData(qf).get('q'+i)==='1'),0);S.quiz={score:z,total:QUIZ.length};save();qr.innerHTML=`<div class="card"><div class="metric">${z}/${QUIZ.length}</div><p>${z>=10?'ورود به تمرین‌های C1':'مرور مبانی B2 توصیه می‌شود'}</p></div>`};if(v==='progress')e.innerHTML=`<h2>پیشرفت و پشتیبان</h2><div class="grid"><div class="card"><h3>کل</h3><div class="metric">${pct()}٪</div></div><div class="card"><h3>مطالعه‌شده</h3><div class="metric">${S.done.length}</div></div><div class="card"><h3>جملات منتخب</h3><div class="metric">${S.fav.length}</div></div><div class="card"><h3>پاسخ پرونده</h3><div class="metric">${Object.keys(S.answers).length}</div></div><div class="card"><h3>آزمون</h3><div class="metric">${S.quiz?S.quiz.score+'/'+S.quiz.total:'—'}</div></div></div><p><button class="btn" onclick="backup()">خروجی JSON</button> <button class="btn secondary" onclick="if(confirm('حذف شود؟')){localStorage.removeItem(K);location.reload()}">بازنشانی</button></p>`}function done(x){S.done=S.done.includes(x)?S.done.filter(y=>y!==x):[...S.done,x];save();render(S.view)}function fav(i){S.fav=S.fav.includes(i)?S.fav.filter(x=>x!==i):[...S.fav,i];save();render('phrases')}function skill(k){S.skill[k]=Math.min(100,S.skill[k]+25);save();render('skills')}function saveCase(i){S.answers[i]=document.getElementById('ca'+i).value;save();alert('ذخیره شد')}function analyze(){let t=wt.value.trim(),w=t?t.split(/\s+/).length:0,C=['daher','folglich','jedoch','hingegen','sofern','zwar'],L=['zu prüfen','es stellt sich die frage','im vorliegenden fall','im ergebnis','gemäß'],B=['super','cool','irgendwie','ich finde'];S.writing=t;save();fb.innerHTML=`<div><b>تعداد واژه:</b> ${w}</div><div><b>پیوندهای استدلالی:</b> ${C.filter(x=>t.toLowerCase().includes(x)).length}</div><div><b>نشانگر حقوقی:</b> ${L.filter(x=>t.toLowerCase().includes(x)).length}</div><div><b>عبارت محاوره‌ای:</b> ${B.filter(x=>t.toLowerCase().includes(x)).join(', ')||'یافت نشد'}</div>`}function backup(){let b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='Legal-German-MasterKit-v2.1-backup.json';a.click()}nav();go(S.view);if('serviceWorker'in navigator)navigator.serviceWorker.register('.
