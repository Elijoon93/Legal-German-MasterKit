<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f2f3a">
<meta name="description" content="Legal German MasterKit v4.0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Legal German MasterKit v4.0</title>
<style>
:root{--bg:#f2f6f8;--surface:#fff;--ink:#163247;--muted:#657786;--line:#d7e2e7;--brand:#0b7285;--brand2:#0f2f3a;--soft:#e8f3f5;--ok:#2b8a3e;--warn:#b26a00;--bad:#c92a2a;--shadow:0 10px 28px rgba(15,47,58,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif;line-height:1.7}
button,input,select,textarea{font:inherit}.app{min-height:100vh}.top{position:sticky;top:0;z-index:60;background:linear-gradient(135deg,var(--brand2),var(--brand));color:#fff;padding:11px 14px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 16px #0002}.brand h1{margin:0;font-size:1rem}.brand small{display:block;color:#d6edf0;font-size:.72rem}.top-actions{display:flex;gap:8px}.icon-btn{min-width:44px;min-height:44px;border:1px solid #ffffff70;background:#ffffff12;color:#fff;border-radius:12px}
.layout{max-width:1440px;margin:auto;display:grid;grid-template-columns:260px 1fr;gap:14px;padding:14px}.side{position:sticky;top:80px;align-self:start;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:var(--shadow)}.side button{width:100%;border:0;background:transparent;color:var(--muted);text-align:right;padding:12px;border-radius:12px;margin:2px 0}.side button.active{background:var(--soft);color:var(--brand);font-weight:700}.side .group{font-size:.73rem;color:#8aa0ad;padding:10px 12px 4px}
.main{min-width:0}.view{display:none}.view.active{display:block}.hero,.panel,.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.hero{padding:22px;background:linear-gradient(135deg,#12344d,#0b7285);color:#fff}.hero h2{margin:0 0 8px;font-size:clamp(1.3rem,4vw,2.1rem)}.hero p{color:#d6edf0;max-width:850px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.grid.two{grid-template-columns:repeat(2,1fr)}.card,.panel{padding:16px}.card h3,.panel h3{margin:0 0 8px}.metric{font-size:1.9rem;font-weight:800;color:var(--brand)}.muted{color:var(--muted)}.pill{display:inline-block;background:var(--soft);border-radius:999px;padding:4px 9px;font-size:.78rem;margin:2px}.btn{min-height:44px;border:0;border-radius:12px;background:var(--brand);color:#fff;padding:0 15px;cursor:pointer}.btn.secondary{background:var(--soft);color:var(--ink)}.btn.good{background:var(--ok)}.btn.warn{background:var(--warn)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.toolbar>*{flex:1;min-width:150px}.input,.select,textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;color:var(--ink)}textarea{min-height:180px;direction:ltr;text-align:left}.bar{height:10px;background:#dde8ed;border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;background:var(--brand)}.task{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.task:last-child{border-bottom:0}.task input{width:20px;height:20px}.lesson{border-right:5px solid var(--brand)}.acc{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}.acc summary{padding:14px;font-weight:700;cursor:pointer}.acc>div{padding:0 14px 14px}.de{direction:ltr;text-align:left}.example,.feedback,.step{background:var(--soft);border-radius:12px;padding:11px;margin:8px 0}.feedback.ok{border-right:4px solid var(--ok)}.feedback.warn{border-right:4px solid var(--warn)}.feedback.bad{border-right:4px solid var(--bad)}.option{display:block;border:1px solid var(--line);border-radius:12px;padding:10px;margin:7px 0;background:#fff}.flash{min-height:220px;display:grid;place-items:center;text-align:center}.flash .front{font-size:1.35rem;font-weight:800;direction:ltr}.rating{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.bottom{display:none}
@media(max-width:1000px){.layout{grid-template-columns:1fr}.side{display:none}.grid,.grid.two{grid-template-columns:1fr}body{padding-bottom:82px}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:70;display:grid;grid-template-columns:repeat(5,1fr);background:#fffffffa;border-top:1px solid var(--line);padding:5px 4px calc(5px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px #0001}.bottom button{border:0;background:transparent;color:var(--muted);min-height:58px;font-size:.69rem}.bottom button b{display:block;font-size:1.08rem}.bottom button.active{color:var(--brand);font-weight:700}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><h1>Legal German MasterKit v4.0</h1><small>LL.M. oec. · Friedrich-Schiller-Universität Jena</small></div><div class="top-actions"><button id="install" class="icon-btn" hidden>نصب</button><button class="icon-btn" onclick="exportData()">⇩</button></div></header>
<div class="layout">
<aside class="side" id="side"></aside>
<main class="main">
<section id="dashboard" class="view active"></section>
<section id="today" class="view"></section>
<section id="curriculum" class="view"></section>
<section id="skills" class="view"></section>
<section id="cases" class="view"></section>
<section id="writing" class="view"></section>
<section id="exam" class="view"></section>
<section id="review" class="view"></section>
<section id="resources" class="view"></section>
<section id="profile" class="view"></section>
</main></div>
<nav class="bottom" id="bottom"></nav></div>
<script>
const KEY='lgmk-v4-state';
let S=JSON.parse(localStorage.getItem(KEY)||'{}');
S={view:'dashboard',level:null,done:[],tasks:{},caseAnswers:{},writing:{},quizScores:[],cards:{},hours:0,name:'سهیل',...S};
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const MENU=[
['dashboard','⌂','داشبورد','اصلی'],['today','☑','امروز','اصلی'],['curriculum','§','دروس','آموزش'],['skills','◫','چهار مهارت','آموزش'],
['cases','⚖','کلینیک پرونده','تمرین'],['writing','✎','آزمایشگاه نگارش','تمرین'],['exam','✓','مرکز آزمون','ارزیابی'],['review','⟳','مرور هوشمند','ارزیابی'],['resources','▤','منابع','مرجع'],['profile','◉','پروفایل','مرجع']];
const COURSES=[
{g:'Privates Wirtschaftsrecht',items:['BGB Allgemeiner Teil','Schuldrecht AT/BT','Vertragsrecht','Handelsrecht','Gesellschaftsrecht','Arbeitsrecht','Insolvenzrecht']},
{g:'Öffentliches Wirtschaftsrecht',items:['Staatsorganisationsrecht','Grundrechte','Allgemeines Verwaltungsrecht','Wirtschaftsverwaltungsrecht','Vergaberecht','Regulierungsrecht','Umweltrecht']},
{g:'Europäisches Wirtschaftsrecht',items:['Binnenmarkt','Grundfreiheiten','Kartellrecht','Beihilfenrecht','Internationales Wirtschaftsrecht']},
{g:'Wissenschaftliches Arbeiten',items:['Literaturrecherche','Juristische Zitierweise','Seminararbeit','Präsentation','Magisterarbeit']},
{g:'Praxis',items:['Zwei Seminare','Achtwöchiges Praktikum','Fallbearbeitung','Mündliche Diskussion']}
];
const SKILLS=[
{n:'Lesen',fa:'خواندن',tasks:['خواندن یک ماده BGB و استخراج فعل حقوقی','خلاصه یک رأی در ۵ جمله','تشخیص ادعا و دلیل در متن علمی']},
{n:'Hören',fa:'شنیدن',tasks:['گوش‌دادن به سخنرانی حقوقی و یادداشت کلیدواژه','بازسازی ساختار استدلال شنیداری','تمرین واژگان تلفظی']},
{n:'Schreiben',fa:'نوشتن',tasks:['نوشتن Obersatz','بازنویسی محاوره‌ای به علمی','نوشتن پاراگراف Seminararbeit']},
{n:'Sprechen',fa:'گفتار',tasks:['ارائه ۲ دقیقه‌ای یک مسئله حقوقی','بیان موافقت و مخالفت علمی','دفاع شفاهی از نتیجه پرونده']}
];
const CASES=[
{id:'buy',t:'Kaufvertrag',area:'Vertragsrecht',facts:'K bestellt bei V einen Laptop. V bestätigt die Bestellung, liefert aber nicht.',q:'Kann K Lieferung verlangen?',check:['Anspruchsgrundlage','Vertragsschluss','Fälligkeit','Einwendungen','Ergebnis'],model:'K könnte gegen V einen Anspruch auf Übergabe und Übereignung aus § 433 Abs. 1 Satz 1 BGB haben. Ein Kaufvertrag setzt Angebot und Annahme voraus. K bestellte den Laptop; V bestätigte die Bestellung. Damit liegt ein wirksamer Kaufvertrag vor. Mangels entgegenstehender Einwendungen besteht grundsätzlich ein Anspruch auf Lieferung.'},
{id:'permit',t:'Gewerbeerlaubnis',area:'Wirtschaftsverwaltungsrecht',facts:'A beantragt eine Erlaubnis. Die Behörde lehnt ohne Anhörung und Begründung ab.',q:'Ist der Bescheid formell rechtmäßig?',check:['Zuständigkeit','Anhörung','Form','Begründung','Heilung'],model:'Die formelle Rechtmäßigkeit setzt Zuständigkeit, ordnungsgemäßes Verfahren und Form voraus. Da A vor Erlass nicht angehört wurde und eine Begründung fehlt, bestehen erhebliche formelle Bedenken.'},
{id:'cartel',t:'Preisabsprache',area:'EU-Kartellrecht',facts:'Zwei Wettbewerber vereinbaren eine gemeinsame Preiserhöhung.',q:'Liegt ein Verstoß gegen Art. 101 AEUV vor?',check:['Unternehmen','Vereinbarung','Wettbewerbsbeschränkung','Zwischenstaatlichkeit','Freistellung'],model:'Die Preisabsprache ist eine Vereinbarung zwischen Unternehmen und bezweckt eine Wettbewerbsbeschränkung. Bei spürbarer Beeinträchtigung des zwischenstaatlichen Handels liegt grundsätzlich ein Verstoß gegen Art. 101 Abs. 1 AEUV vor.'}
];
const QUIZ=[
['کدام عبارت Obersatz است؟',['K könnte gegen V einen Anspruch haben.','Der Vertrag war gestern.','Ich finde das unfair.'],0],
['Subsumtion چیست؟',['تطبیق واقعیت با معیار حقوقی','فهرست منابع','بیان احساس شخصی'],0],
['برای نقل نظر غالب؟',['Nach herrschender Meinung …','Ich denke …','Vielleicht …'],0],
['کدام فعل برای الزام است؟',['muss','kann','möchte'],0],
['کدام عبارت نتیجه است؟',['Im Ergebnis ist festzuhalten, dass …','Zunächst …','Unter … versteht man …'],0],
['Magisterarbeit چیست؟',['کار علمی نهایی دوره','کارآموزی','آزمون زبان'],0],
['DSH-2 چیست؟',['مدرک زبان ورود دانشگاه','قانون مدنی','نوع سمینار'],0],
['کدام سبک علمی‌تر است؟',['Die Entscheidung überzeugt nicht, weil …','Das ist Quatsch.','Ich mag das nicht.'],0]
];
const DECK=[
['der Anspruch','حق مطالبه','K hat einen Anspruch auf Lieferung.'],['die Voraussetzung','شرط','Voraussetzung ist ein wirksamer Vertrag.'],['die Willenserklärung','اظهار اراده','Angebot und Annahme sind Willenserklärungen.'],['die Subsumtion','تطبیق','Die Subsumtion verbindet Norm und Sachverhalt.'],['die Rechtsprechung','رویه قضایی','Die Rechtsprechung des BGH ist zu beachten.'],['die Verhältnismäßigkeit','تناسب','Die Maßnahme muss verhältnismäßig sein.'],['die Anhörung','استماع اظهارات','Vor dem Bescheid ist eine Anhörung erforderlich.'],['die Rechtsfolge','اثر حقوقی','Die Rechtsfolge ist die Nichtigkeit.']];
function navBuild(){let groups=[...new Set(MENU.map(x=>x[3]))];side.innerHTML=groups.map(g=>`<div class="group">${g}</div>${MENU.filter(x=>x[3]===g).map(x=>`<button data-v="${x[0]}">${x[1]} ${x[2]}</button>`).join('')}`).join('');bottom.innerHTML=MENU.slice(0,5).map(x=>`<button data-v="${x[0]}"><b>${x[1]}</b>${x[2]}</button>`).join('');document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>go(b.dataset.v))}
function go(v){S.view=v;save();document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===v));document.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('active',x.dataset.v===v));render(v)}
function pct(){return Math.min(100,Math.round((S.done.length+Object.keys(S.tasks).length+Object.keys(S.caseAnswers).length+Object.keys(S.writing).length+S.quizScores.length*2)/30*100))}
function render(v){const e=document.getElementById(v);
if(v==='dashboard')e.innerHTML=`<div class="hero"><h2>${S.name}، مسیر امروزت آماده است</h2><p>این ساختار مانند یک سامانه آموزشی کامل عمل می‌کند: برنامه روزانه، درس، پرونده، نگارش، آزمون و مرور در یک داشبورد واحد.</p><button class="btn" onclick="go('today')">شروع برنامه امروز</button></div><div class="grid"><div class="card"><h3>پیشرفت کل</h3><div class="metric">${pct()}٪</div><div class="bar"><span style="width:${pct()}%"></span></div></div><div class="card"><h3>پرونده‌های پاسخ‌داده</h3><div class="metric">${Object.keys(S.caseAnswers).length}/${CASES.length}</div></div><div class="card"><h3>آزمون‌ها</h3><div class="metric">${S.quizScores.length}</div></div></div><div class="grid two"><div class="panel"><h3>ادامه مسیر پیشنهادی</h3><p>۱. یک درس خصوصی یا عمومی بخوانید.</p><p>۲. یک پرونده حل کنید.</p><p>۳. ۱۰ دقیقه Writing Lab انجام دهید.</p></div><div class="panel"><h3>وضعیت دانشگاهی</h3><span class="pill">DSH-2 / معادل</span><span class="pill">۲ سمینار</span><span class="pill">کارآموزی ۸ هفته‌ای</span><span class="pill">Magisterarbeit</span></div></div>`;
if(v==='today'){const tasks=['۲۰ دقیقه Lesen حقوقی','۱۰ فلش‌کارت SRS','یک Obersatz بنویس','یک پرونده کوتاه حل کن'];e.innerHTML=`<div class="panel"><h3>برنامه امروز</h3>${tasks.map((t,i)=>`<label class="task"><input type="checkbox" ${S.tasks['t'+i]?'checked':''} onchange="S.tasks['t${i}']=this.checked;save();render('today')"><span>${t}</span><span class="pill">${[20,10,10,25][i]} دقیقه</span></label>`).join('')}<p class="muted">پیشرفت امروز: ${Object.values(S.tasks).filter(Boolean).length}/${tasks.length}</p></div>`}
if(v==='curriculum')e.innerHTML=`<div class="panel"><h3>کتابخانه دروس LL.M. oec.</h3><p class="muted">هسته ثابت رشته + دروس انتخابی متغیر هر ترم.</p></div><div class="grid">${COURSES.map(c=>`<article class="card lesson"><h3>${c.g}</h3>${c.items.map(x=>`<button class="btn secondary" style="margin:4px" onclick="toggleDone('${c.g}:${x}')">${S.done.includes(c.g+':'+x)?'✓ ':''}${x}</button>`).join('')}</article>`).join('')}</div>`}
if(v==='skills')e.innerHTML=`<div class="grid">${SKILLS.map(s=>`<article class="card"><h3>${s.n} — ${s.fa}</h3>${s.tasks.map((t,i)=>`<label class="task"><input type="checkbox" ${S.tasks[s.n+i]?'checked':''} onchange="S.tasks['${s.n+i}']=this.checked;save()"><span>${t}</span></label>`).join('')}</article>`).join('')}</div>`}
if(v==='cases')e.innerHTML=`<div class="panel"><h3>کلینیک پرونده</h3><select id="caseSel" class="select" onchange="renderCase(this.value)">${CASES.map(c=>`<option value="${c.id}">${c.t} — ${c.area}</option>`).join('')}</select><div id="caseBox"></div></div>`;if(v==='cases')setTimeout(()=>renderCase(CASES[0].id),0);
if(v==='writing')e.innerHTML=`<div class="panel"><h3>آزمایشگاه نگارش</h3><select id="wt" class="select"><option>Falllösung</option><option>Seminararbeit</option><option>Magisterarbeit</option><option>E-Mail an Professor</option></select><textarea id="wtext" placeholder="متن آلمانی را بنویسید...">${S.writing.main||''}</textarea><button class="btn" onclick="checkWriting()">تحلیل متن</button><div id="wfb"></div></div>`;
if(v==='exam')e.innerHTML=`<div class="panel"><h3>مرکز آزمون</h3><form id="qf">${QUIZ.map((q,i)=>`<fieldset class="option"><legend>${i+1}. ${q[0]}</legend>${q[1].map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join('')}</fieldset>`).join('')}<button class="btn">تصحیح</button></form><div id="qres"></div></div>`;if(v==='exam')setTimeout(()=>qf.onsubmit=ev=>{ev.preventDefault();let sc=0;QUIZ.forEach((q,i)=>{let a=new FormData(qf).get('q'+i);if(Number(a)===q[2])sc++});S.quizScores.push(sc);save();qres.innerHTML=`<div class="feedback ${sc>=6?'ok':'warn'}">امتیاز: ${sc}/${QUIZ.length}</div>`},0);
if(v==='review'){let i=DECK.findIndex((_,i)=>!S.cards[i]||S.cards[i].next<=Date.now());if(i<0)i=0;let d=DECK[i];e.innerHTML=`<div class="panel flash"><div><div class="front">${d[0]}</div><p>${d[1]}</p><div class="example de">${d[2]}</div><div class="rating"><button class="btn warn" onclick="rate(${i},0)">دوباره</button><button class="btn" onclick="rate(${i},1)">متوسط</button><button class="btn good" onclick="rate(${i},2)">آسان</button></div></div></div>`}
if(v==='resources')e.innerHTML=`<div class="grid"><div class="card"><h3>قوانین</h3><p>BGB · HGB · VwVfG · GG · AEUV</p></div><div class="card"><h3>پایگاه‌ها</h3><p>Beck-Online · Juris · EUR-Lex · Bundesgerichtshof</p></div><div class="card"><h3>کار علمی</h3><p>Friedolin · Moodle · Leitlinien der Fakultät · Zotero</p></div></div>`;
if(v==='profile')e.innerHTML=`<div class="panel"><h3>پروفایل یادگیری</h3><label>نام<input class="input" value="${S.name}" onchange="S.name=this.value;save()"></label><label>سطح هدف<select class="select" onchange="S.level=this.value;save()"><option>B2</option><option ${S.level==='C1'?'selected':''}>C1</option><option ${S.level==='C2'?'selected':''}>C2</option></select></label><p class="muted">تمام داده‌ها محلی ذخیره می‌شوند.</p><button class="btn secondary" onclick="exportData()">خروجی پشتیبان</button></div>`}
}
function toggleDone(k){S.done=S.done.includes(k)?S.done.filter(x=>x!==k):[...S.done,k];save();render('curriculum')}
function renderCase(id){let c=CASES.find(x=>x.id===id);caseBox.innerHTML=`<div class="step de">${c.facts}</div><h3>${c.q}</h3><p>${c.check.map(x=>`<span class="pill">${x}</span>`).join('')}</p><textarea id="ct">${S.caseAnswers[id]||''}</textarea><button class="btn" onclick="checkCase('${id}')">ارزیابی پاسخ</button><button class="btn secondary" onclick="showModel('${id}')">پاسخ نمونه</button><div id="cfb"></div>`}
function checkCase(id){let c=CASES.find(x=>x.id===id),t=ct.value;S.caseAnswers[id]=t;save();let hit=c.check.filter(x=>t.toLowerCase().includes(x.toLowerCase().split(' ')[0]));cfb.innerHTML=`<div class="feedback ${hit.length>=3?'ok':'warn'}">پوشش عناصر: ${hit.length}/${c.check.length}. ${hit.length<3?'پاسخ را با مبنای قانونی، تعریف، تطبیق و نتیجه تکمیل کنید.':'ساختار پایه مناسب است.'}</div>`}
function showModel(id){cfb.innerHTML=`<div class="feedback ok de">${CASES.find(x=>x.id===id).model}</div>`}
function checkWriting(){let t=wtext.value;S.writing.main=t;save();let fb=[];if(t.split(/\s+/).length<60)fb.push('متن برای تحلیل دانشگاهی کوتاه است.');if(/\b(ich finde|cool|quatsch|irgendwie)\b/i.test(t))fb.push('عبارت محاوره‌ای شناسایی شد.');if(!/(daher|folglich|jedoch|allerdings|zunächst|im ergebnis)/i.test(t))fb.push('پیوند استدلالی کم است.');if(wt.value==='Falllösung'&&!/(könnte|zu prüfen|voraussetzung|im ergebnis)/i.test(t))fb.push('ساختار Gutachtenstil ناقص است.');wfb.innerHTML=`<div class="feedback ${fb.length?'warn':'ok'}">${fb.length?fb.join('<br>'):'ساختار پایه مناسب است.'}</div>`}
function rate(i,r){S.cards[i]={next:Date.now()+[0,2,7][r]*86400000,reps:(S.cards[i]?.reps||0)+1};save();render('review')}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='legal-german-masterkit-backup.json';a.click()}
let deferred;addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;install.hidden=false});install.onclick=async()=>{if(deferred){deferred.prompt();deferred=null;install.hidden=true}}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js');
navBuild();go(S.view);
</script>
</body></html>
